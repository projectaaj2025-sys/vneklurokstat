/* раунд 13: блоки открытой теории раскладываются в две сбалансированные колонки,
   чтобы в сетке не оставалось пустых ячеек и нижней пустой полосы.
   Берём только карточки/рисунки/тесты — служебные узлы (подсказка, кнопки) не трогаем. */
function thTuck(){
  const sl=$('#slide');if(!sl||!sl.classList.contains('th-open'))return;
  const fit=$('#body .fit');if(!fit)return;
  if(window.innerWidth<1000||document.body.classList.contains('phone'))return;
  const WRAP='.theory.rvbody,.rvbody,.two,.thgrid,.rvwrap';
  const BLK='.card,.shot,.figbox,.quiz,.infbox,figure,polldots,.cfigure';
  const blocks=[],wrs=[];
  (function collect(node){
    [...node.children].forEach(e=>{
      const cs=getComputedStyle(e);if(cs.display==='none')return;
      if(e.matches(WRAP)){wrs.push(e);collect(e);return;}
      if(e.matches(BLK))blocks.push(e);
    });
  })(fit);
  const wide=blocks.filter(e=>/\bwide\b/.test(e.className));
  if(wide.length)blocks.splice(0,blocks.length,...blocks.filter(e=>wide.indexOf(e)<0));
  if(blocks.length<3)return;
  let ref=blocks[0];while(ref.parentElement&&ref.parentElement!==fit)ref=ref.parentElement;
  if(ref.parentElement!==fit)return;
  let wrap=fit.querySelector('.thcols');
  if(!wrap){wrap=document.createElement('div');wrap.className='thcols';
    for(let q=0;q<2;q++){const c=document.createElement('div');c.className='thcol';wrap.appendChild(c);}
    fit.insertBefore(wrap,ref);}
  const cols=[...wrap.children];
  /* два способа разложить блоки и один замер «разницы колонок» уже на экране:
     A — каждый следующий блок в более короткую колонку, B — два подряд идущих участка */
  const best=hh=>{
    const A=[[],[]],sa=[0,0];
    blocks.forEach((el,i)=>{const k=sa[0]<=sa[1]?0:1;A[k].push(el);sa[k]+=hh[i];});
    let tot=0;hh.forEach(x=>tot+=x);let acc=0,B=null,bd=1e9;
    for(let i=0;i<hh.length-1;i++){acc+=hh[i];const d=Math.abs(acc-(tot-acc));if(d<bd){bd=d;B=[blocks.slice(0,i+1),blocks.slice(i+1)];}}
    return (B&&bd<Math.abs(sa[0]-sa[1])-8)?B:A;
  };
  const hh=()=>blocks.map(e=>e.getBoundingClientRect().height+14);
  const place=C=>{C[0].forEach(el=>cols[0].appendChild(el));C[1].forEach(el=>cols[1].appendChild(el));};
  const spread=C=>{const q=[0,0];C.forEach((g,k)=>g.forEach(el=>q[k]+=el.getBoundingClientRect().height+14));return Math.abs(q[0]-q[1]);};
  const C1=best(hh());place(C1);
  const C2=best(hh());
  if(spread(C2)<spread(C1)-10)place(C2);
  wrs.forEach(g=>{const vis=[...g.children].filter(c=>getComputedStyle(c).display!=='none');
    if(!vis.length)g.style.display='none';});
  /* широкие блоки (тест на весь слайд) кладём под колонки — иначе в колонке они пустуют */
  if(wide.length){wrap.after&&wide.forEach(el=>{
    let a=el;while(a.parentElement&&a.parentElement!==fit)a=a.parentElement;
    if(a.parentElement===fit)fit.insertBefore(a,wrap.nextSibling);});}
}

const CX=400,GB_DUR=1400;
const GB={bins:Array(11).fill(0),n:0,balls:[],raf:0};
const CBIN=[1,10,45,120,210,252,210,120,45,10,1];
const PRED_G={q:'Куда чаще упадёт шарик: в центральную ячейку или в крайнюю?',opts:['В крайнюю','В центральную'],ok:1,exp:'В центре 252 пути из 1024, а в крайнюю ведёт только один путь. Поэтому центр выбирается гораздо чаще.'};
const PRED_D={q:'Симулятор сделал 1000 бросков, среднее вышло 3,51. Бросков сделали 4000 (в 4 раза больше). Что станет с типичным отклонением среднего от 3,5?',opts:['уменьшится в 2 раза','уменьшится в 4 раза','останется таким же','вырастет в 2 раза'],ok:0,exp:'Разброс среднего — это σ/√n: n выросло в 4 раза, √n — только в 2. Значит отклонение уменьшится вдвое, а не вчетверо, и до 3,5 среднее не дойдёт никогда — оно будет ближе. Проверьте: жмите +1000 четыре раза и смотрите на график.'};
const fmt=x=>String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function predHTML(P){return `<div class="quiz pred" data-exp="${P.exp}"><p class="pq"><b>Прогноз до симулятора.</b> ${P.q}</p><div class="qrow">${P.opts.map((o,i)=>`<button class="qopt" data-qo data-ok="${i===P.ok?1:0}">${o}</button>`).join('')}</div><div class="qfb"></div></div>`;}

/* --- доска Гальтона: шарики падают, на каждом гвоздике случайно влево или вправо --- */
function gbSample(){
  const pts=[[CX,8]];let c=0;
  for(let r=0;r<10;r++){pts.push([CX+(c-r/2)*44,30+r*20]);if(Math.random()<0.5)c++;}
  pts.push([CX+(c-5)*44,214]);
  return {pts,bin:c};
}
function gbDraw(now){
  const cv=document.getElementById('gbC');if(!cv)return;
  const g=cv.getContext('2d');const W=cv.width,H=cv.height;
  g.clearRect(0,0,W,H);
  g.fillStyle='#8a7f6c';
  for(let r=0;r<10;r++)for(let j=0;j<=r;j++){g.beginPath();g.arc(CX+(j-r/2)*44,30+r*20,4,0,6.283);g.fill();}
  const N=GB.n,ex=CBIN.map(c=>N*c/1024);
  const mx=Math.max(4,...GB.bins,...ex);
  const base=330,maxH=110;
  for(let k=0;k<11;k++){
    const x=CX+(k-5)*44,h=GB.bins[k]/mx*maxH;
    g.fillStyle='#f6d54a';g.strokeStyle='#2d2a26';g.lineWidth=2;
    g.fillRect(x-18,base-h,36,h);g.strokeRect(x-18,base-h,36,h);
  }
  g.setLineDash([7,5]);g.strokeStyle='#e2473f';g.lineWidth=2.5;g.beginPath();
  ex.forEach((v,k)=>{const x=CX+(k-5)*44,y=base-v/mx*maxH;k?g.lineTo(x,y):g.moveTo(x,y);});
  g.stroke();g.setLineDash([]);
  GB.balls.forEach(bl=>{
    if(now<bl.t0)return;
    const t=Math.min(1,(now-bl.t0)/GB_DUR),L=bl.pts.length-1,pos=t*L;
    const i=Math.min(L-1,Math.floor(pos)),u=pos-i;
    const [x1,y1]=bl.pts[i],[x2,y2]=bl.pts[i+1];
    g.beginPath();g.arc(x1+(x2-x1)*u,y1+(y2-y1)*u,7,0,6.283);
    g.fillStyle='#e2473f';g.fill();g.strokeStyle='#2d2a26';g.lineWidth=2;g.stroke();
  });
}
function gbStats(){
  const st=$('#gbStats');if(!st)return;
  const N=GB.n;
  if(!N){st.innerHTML='<div class="kpi">Пока пусто. Бросайте шарики и смотрите, где их больше всего.</div>';return;}
  const mean=GB.bins.reduce((a,v,k)=>a+k*v,0)/N;
  st.innerHTML=`<div class="kpi">Шариков упало: <b>${N}</b>. Средняя ячейка: <b>${f(mean,2)}</b> (теория: 5)</div>
    <div class="kpi">В центральной ячейке: <b>${pc(GB.bins[5]/N,1)}</b> (теория: ${pc(252/1024,1)})</div>`;
}
function gbTick(){
  const now=performance.now();
  GB.balls=GB.balls.filter(bl=>{if(now-bl.t0>=GB_DUR){GB.bins[bl.bin]++;GB.n++;return false;}return true;});
  gbDraw(now);gbStats();
  GB.raf=GB.balls.length?requestAnimationFrame(gbTick):0;
}
function gbAdd(k){
  const now=performance.now();
  if(k===0){GB.bins=Array(11).fill(0);GB.n=0;GB.balls=[];gbDraw(now);gbStats();return;}
  if(k>=100){for(let i=0;i<k;i++){GB.bins[gbSample().bin]++;GB.n++;}gbDraw(now);gbStats();return;}
  for(let i=0;i<k;i++){const s=gbSample();GB.balls.push({pts:s.pts,bin:s.bin,t0:now+i*90});}
  if(!GB.raf)GB.raf=requestAnimationFrame(gbTick);
}

  el.innerHTML=`<div>

/* --- среднее броска кубика --- */
const DICE={h:[]};
function dcDraw(){
  const box=$('#dcChart');if(!box)return;
  const N=DICE.h.length;
  if(!N){box.innerHTML='<p class="hint">График появится после первого броска. Ось X — логарифмическая.</p>';$('#dcStats').innerHTML='<div class="kpi">Пока нет бросков. Нажмите «Бросить 1».</div>';return;}
  const W=600,H=110,step=Math.max(1,Math.ceil(N/400));let s=0;const pts=[];
  for(let i=0;i<N;i++){
    s+=DICE.h[i];
    if(i%step===0||i===N-1){const avg=s/(i+1),x=N>1?Math.log10(i+1)/Math.log10(N)*W:0,y=H-((avg-1)/5)*H;pts.push(x.toFixed(1)+','+y.toFixed(1));}
  }
  const yT=H-((3.5-1)/5)*H;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${yT}" y2="${yT}" stroke="#e2473f" stroke-width="2" stroke-dasharray="7 5"/><polyline class="walk" pathLength="100" points="${pts.join(' ')}" fill="none" stroke="#2d2a26" stroke-width="2.5"/></svg><div class="axis"><span>среднее: от 1 до 6</span><span>красная линия — 3,5</span><span>бросков: 1 → ${N}</span></div>`;
  const mean=s/N,sd=Math.sqrt(35/12);
  $('#dcStats').innerHTML=`<div class="kpi">Бросков: <b>${N}</b>. Среднее: <b>${f(mean,2)}</b>. M(X) = 3,5</div>
    <div class="kpi">D(X) = 35/12 ≈ 2,92; σ ≈ 1,71. Типичная ошибка среднего σ/√n = <b>${f(sd/Math.sqrt(N),3)}</b></div>`;
}
function simDice(el){
  el.innerHTML=`<div>
   <div class="btns" style="margin-top:0"><button class="btn red sm" id="dc1">Бросить 1</button><button class="btn sm" id="dc10">+10</button><button class="btn sm" id="dc100">+100</button><button class="btn sm" id="dc1000">+1000</button><button class="btn ghost sm" id="dcR">Сброс</button></div>
   <div class="chart" id="dcChart"></div>
   <div id="dcStats"></div></div>`;
  const add=k=>{for(let i=0;i<k;i++)DICE.h.push(Math.floor(Math.random()*6)+1);dcDraw();};

}

const INS={n:1000,p:5,years:[]};
function insYear(n,p){let c=0;for(let i=0;i<n;i++)if(Math.random()<p)c++;return n*120-c*1500;}
function insRender(el){

    <div class="kpi">${T?`Лет с убытком из ${T}: <b>${L}</b>. Зелёный квадрат — год с прибылью, красный — с убытком.`:'Нажмите «Прожить год» или «100 лет».'}</div>`;

      <p>Если в каждом из n независимых опытов вероятность появления события A постоянна и равна p, то при достаточно большом числе испытаний вероятность того, что модуль отклонения относительной частоты появлений A от p будет сколь угодно малым, как угодно близка к 1.</p>
      <div class="mf"><math display="block"><mi>P</mi><mo>(</mo><mo>|</mo><mfrac><mi>m</mi><mi>n</mi></mfrac><mo>−</mo><mi>p</mi><mo>|</mo><mo>&lt;</mo><mi mathvariant="normal">ε</mi><mo>)</mo><mo>→</mo><mn>1</mn></math></div>
      <p class="hint">m — число появлений события A в n опытах.</p>
    </div>
    <div class="card enter" style="animation-delay:.15s"><div class="pflex"><div class="ptext"><h3>Простыми словами</h3><p>Бросаем кубик очень много раз: доля выпадений шестёрки становится почти равна 1/6.</p><p class="note" style="margin-top:10px"><b>Запомните:</b> теорема Бернулли — частный случай теоремы Чебышева.</p></div><figure class="portrait"><img src="${IMG.bern}" alt="Якоб Бернулли"><figcaption>Якоб Бернулли (1654–1705), швейцарский математик</figcaption></figure></div></div>
  </div>`;
}

const EXTRA2={"pend0": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Подумайте перед ответом</h3><ol><li>Что будет с шансом решки, если монетка уже 5 раз упала орлом?</li><li>Зависит ли следующий бросок от прошлых?</li><li>Выравнивается ли количество орлов или их доля?</li></ol></div>", "pend1": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Подумайте перед ответом</h3><ol><li>Сколько людей нужно опросить, чтобы ошибка была ±1%?</li><li>Влияет ли размер всего города на точность опроса?</li><li>Что испортит опрос, даже если людей очень много?</li></ol></div>", "pend2": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Подумайте перед ответом</h3><ol><li>Выигрывает ли игрок каждый раз, если он удваивает ставку?</li><li>Что будет, если серия проигрышей окажется длиннее его капитала?</li><li>Что означает «почти наверняка» для одной сессии?</li></ol></div>", "sum36": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Главное за урок</h3><ul class=\"b\"><li>Закон больших чисел говорит о ДОЛЕ, а не о «компенсации» после серии.</li><li>Точность опроса определяет размер выборки n, а не размер страны.</li><li>В азартных играх «почти наверняка» не значит «гарантировано»: решает M(X) на длинной дистанции.</li></ul></div>", "check37": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Чек-лист для любого утверждения</h3><ol><li>Что здесь X и какие исходы возможны?</li><li>Какой M(X)? Что будет в среднем?</li><li>Какие D и σ? Насколько результаты разлетаются?</li><li>Сколько испытаний? Закон работает только на длинной дистанции.</li><li>Проверьте симулятором или таблицей.</li></ol></div>", "extra3": "<div class=\"card\" style=\"margin-top:10px;\"><b>Почему это важно.</b> Казино, страховые компании и опросы опираются на один и тот же закон. Поэтому разбираться в нём полезно всем, а не только статистикам.</div>", "th01": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Сравните</h3><p>5 орлов подряд — шанс серии 1/32 ≈ 3%, 10 орлов — 1/1024 ≈ 0,1%. Серия действительно редка. Но редкость уже случившейся серии и «долг» монетки перед решкой — это разные вещи. Какой из них подтверждает теорема, а какой — только ощущение? Проверим числами.</p></div>\n", "th10": "<div class=\"card\" style=\"margin-top:10px;\"><h3>Точность зависит от n</h3><p>n = 100 → ошибка около ±10%. n = 1000 → около ±3%. n = 10 000 → около ±1%. Размер города не меняет картину.</p></div>", "th11": "<div class=\"card\" style=\"margin-top:10px;\"><b>Что значит «с надёжностью 95%».</b> Если повторить опрос 100 раз, примерно в 95 случаях истинная доля попадёт в коридор «оценка ± 1,96σ».</div>", "pic2": "<div class=\"card roulcard\" style=\"margin-top:10px;padding:12px 16px 13px\"><div class=\"roulhead\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFXAUADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD5UooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAClCk9KFG44ziu8+GngGfxTqMWY96M/wAikcEDqx9h6dzWVaqqUeaR3Zdl9XHVlRp+rb2SW7foZ3hXwFqfiOaIRwyKr8qFXLMPUDsPc17h4U/ZzXakl2kcZ9x5j/meB+Ar2XwP8PrHw/ZoscQMjYLuw+Zj7mu4htI4lA2j6CuCXPU1qP5I+jeMwmX/ALvBwUpL7ckm36J6R+WvmeR2/wAC9HSMBxOxHfzSP5VV1P4C6XcRFYzKvpuYOPyYV7ZsXstBjQ9VrP2FL+Un/WfH31qNrt0+7Y+PvGX7PVxYJJNZxbgB1gGCP+AHg/hivFtb8P32iy7LmL5SSA46E+nsfY1+j93p0VwhBUEH2rx74qfCa11mznuLW3TziMsu   const h=EXTRA[key]||EXTRA2[key];if(!h)return;
  const d=document.createElement('div');d.innerHTML=h;

/* ============ АВТО-ПОДГОНКА: ничего не обрезается и не требует прокрутки ============ */

/* ===== раунд 12: подгонка слайда под экран телефона ===== */
const PGKEY='pm_pgfit_v1';
function pgStore(){try{const o=JSON.parse(localStorage.getItem(PGKEY)||'{}');return (o&&typeof o==='object'&&!Array.isArray(o))?o:{};}catch(e){return {};}}
function pgKey(){const sl=$('#slide');return sl&&sl.dataset.k?sl.dataset.k+'/'+idx:String(idx);}
function pgPref(){return pgStore()[pgKey()]||null;}
function pgSetPref(v){const o=pgStore();if(v)o[pgKey()]=v;else delete o[pgKey()];try{localStorage.setItem(PGKEY,JSON.stringify(o));}catch(e){}}
function pgLandscape(){try{return matchMedia('(orientation:landscape) and (max-height:620px)').matches;}catch(e){return innerWidth>innerHeight&&innerHeight<=620;}}
/* auto — подогнать, если текст почти не мельчает; on/off — выбор ученика для этого слайда */
window.__pgMode=function(){
  const m=pgPref();
  if(m==='off')return 'off';
  if(m==='on')return 'on';
  return pgLandscape()?'on':'auto';
};
function pgFabSync(){
  const b=$('#pgFab');if(!b)return;
  const fitted=document.body.classList.contains('pgfit');
  b.innerHTML=fitted
    ?'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
    :'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  b.setAttribute('aria-label',fitted?'Слайд крупно, с прокруткой':'Слайд на всю страницу');
  b.title=fitted?'Крупный текст и прокрутка':'Весь слайд на одной странице';
}
const pgFabBtn=$('#pgFab');
if(pgFabBtn)pgFabBtn.onclick=()=>{
  if(!document.body.classList.contains('phone')){document.body.classList.add('phone');try{localStorage.setItem('pm_layout','phone');}catch(e){}}
  pgSetPref(document.body.classList.contains('pgfit')?'off':'on');
  scheduleFit();pgFabSync();
};
/* визуальная высота подогнанного блока с учётом вылезаний детей */
function pgHeight(fit){
  const r=fit.getBoundingClientRect();
  let bot=r.bottom;
  for(const el of fit.children){
    const st=getComputedStyle(el);
    if(st.display==='none'||st.visibility==='hidden')continue;
    const q=el.getBoundingClientRect();
    if(q.bottom>bot)bot=q.bottom;
  }
  return bot-r.top;
}
/* в ландшафте блоки с графиком/таблицей/фото оставаются на всю ширину, остальные — в две колонки */
function pgWide(fit){
  for(const el of fit.children){
    let w=/^(SVG|CANVAS|TABLE)$/.test(el.tagName);
    if(!w&&el.querySelector){
      const big=!!el.querySelector('canvas,table,.mtab,.tbl');
      const svgs=[...el.querySelectorAll('svg')].some(x=>{const r=x.getBoundingClientRect();return r.width>150||r.height>110;});
      w=big||svgs;
    }
    if(!w&&el.querySelectorAll&&el.querySelectorAll('img').length>=2)w=true;
    if(!w&&(el.textContent||'').replace(/\s+/g,' ').length>820)w=true;
    el.classList.toggle('lwide',w);
  }
}
function pgHintSpace(){
  const h=$('#rothint'),v=$('#viewport');if(!h||!v)return;
  const on=getComputedStyle(h).display!=='none'&&document.body.classList.contains('phone');
  const need=on?h.offsetHeight+12:0;
  if(v.style.getPropertyValue('--hintres')!==need+'px')v.style.setProperty('--hintres',need+'px');
}
function phonePageFit(fit){
  const B=document.body,vp=$('#viewport'),sl=$('#slide');
  if(!vp||!sl)return;
  const clear=()=>{fit.removeAttribute('style');B.classList.remove('pgfit','pgfitlock');pgFabSync();};
  const pref=pgPref(),land=pgLandscape(),mode=window.__pgMode();
  B.classList.toggle('lsc',land);
  pgHintSpace();
  B.classList.add('pgfit');            /* мерим ровно в том состоянии, которое покажем */
  fit.removeAttribute('style');
  if(land)pgWide(fit);                 /* размеры иконок смотрим при снятом зуме */
  const avail=vp.clientHeight-fit.offsetTop-12;      /* offsetTop — не зависит от прокрутки */
  if(avail<200){clear();return;}
  /* раунд 15: автоматически «вписываем» слайд только если это не уменьшает текст.
     Иначе — обычная прокрутка страницы в натуральном размере (кнопка-рамка включает вписывание вручную). */
  const FLOOR=0.42,MIN=0.58;
  let k=0;
  if(pgHeight(fit)<=avail)k=1;
  else{
    let a2=FLOOR,b2=1;
    for(let i=0;i<10;i++){const mid=(a2+b2)/2;fit.style.zoom=String(mid);if(pgHeight(fit)<=avail)a2=mid;else b2=mid;}
    fit.style.zoom=String(a2);k=pgHeight(fit)<=avail+1?a2:0;
  }
  if(k)for(let i=0;i<6&&vp.scrollHeight>vp.clientHeight+1;i++){k=Math.max(FLOOR,k-0.03);fit.style.zoom=String(k);}
  const forced=pref==='on';
  if(mode==='off'||(!k&&!forced)||(k<MIN&&!forced)){clear();return;}
  if(!k)fit.style.zoom='0.58';   /* ручное «вписать» для длинных слайдов: не мельче 0,62, остальное — прокрутка */
  B.classList.add('pgfit');
  B.classList.toggle('pgfitlock',vp.scrollHeight<=vp.clientHeight+1);
  pgFabSync();
}

/* ===== конец раунда 12 ===== */
/* элемент лежит внутри рамки с прокруткой → его «хвост» не должен раздувать слайд */
function inScroller(el,root){
  let p=el.parentElement;
  while(p&&p!==root){
    if(p.classList&&p.classList.contains('fr')){
      const st=getComputedStyle(p);
      if(/(auto|scroll)/.test(st.overflowY))return true;
    }
    p=p.parentElement;
  }
  return false;
}
function autoFit(){
  const w=$('#body');if(!w)return;
  const fit=w.querySelector('.fit');if(!fit)return;
  if(document.body.classList.contains('phone')){phonePageFit(fit);return;}
  const rw=w.clientWidth-12,rh=w.clientHeight-18;
  if(rw<100||rh<100)return;
  // the canvas itself is scaled to the window → normalise measured rects to canvas px
  const sl=$('#slide');
  const cvs=sl&&sl.offsetWidth?Math.abs(sl.getBoundingClientRect().width/sl.offsetWidth)||1:1;
  // measure the content at its natural height (no stretching → the number cannot feed back into itself)
  const measure=s=>{
    fit.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0;transform:scale('+s+');width:'+(rw/s)+'px;height:auto';
    const box=fit.getBoundingClientRect();
    let h=box.height,rt=box.width;
    fit.querySelectorAll('*').forEach(el=>{
      const st2=getComputedStyle(el);
      if(st2.display==='none'||st2.visibility==='hidden')return;
      if(inScroller(el,fit))return;
      const r=el.getBoundingClientRect();
      if(!(r.width||r.height))return;
      const hh=r.bottom-box.top,ww=r.right-box.left;
      if(hh>h)h=hh;if(ww>rt)rt=ww;
    });
    return {h:h/cvs,rt:rt/cvs};
  };
  const MAXS=1.34, MINS=0.3, PAD=1;
  const fits=s=>{const m=measure(s);return m.h<=rh+PAD&&m.rt<=rw+26;};
  let best=MINS;
  if(fits(MAXS))best=MAXS;
  else{
    let lo=MINS,hi=MAXS;
    for(let i=0;i<12;i++){
      const mid=(lo+hi)/2;
      if(fits(mid)){best=mid;lo=mid;}else hi=mid;
    }
  }
  best=Math.round(best*1000)/1000;
  const finH=measure(best).h;   // measure first: measure() rewrites the inline style
  // final: stretched to the canvas so cards fill the whole area, no empty band
  const stretch=s=>{fit.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0;transform:scale('+s+');width:'+(rw/s)+'px;height:'+(rh/s)+'px';};
  // stretched children can need more room than the natural layout → check the real state and shrink if so
  const cur=()=>{
    const box=fit.getBoundingClientRect();let h=0,rt=0;
    fit.querySelectorAll('*').forEach(el=>{
      const st2=getComputedStyle(el);
      if(st2.display==='none'||st2.visibility==='hidden')return;
      if(inScroller(el,fit))return;
      const r=el.getBoundingClientRect();
      if(!(r.width||r.height))return;
      const hh=r.bottom-box.top,ww=r.right-box.left;
      if(hh>h)h=hh;if(ww>rt)rt=ww;
    });
    return {h:h/cvs,rt:rt/cvs};
  };
  stretch(best);
  for(let i=0;i<6;i++){
    const m=cur();
    if(m.h<=rh+PAD&&m.rt<=rw+34)break;
    const ns=Math.max(MINS,Math.round(best*Math.min((rh-PAD)/m.h,(rw+30)/m.rt)*1000)/1000);
    if(ns>=best-0.001)break;
    best=ns;stretch(best);
  }
  if(finH<rh-26&&cur().h<rh-26)fit.style.justifyContent='center';
  fit.dataset.s=String(best);
  try{markScroll(fit);}catch(e){}
}
let fitRaf=0;
function scheduleFit(){cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(autoFit);}
const obs=new MutationObserver(scheduleFit);

/* ============ НАВИГАЦИЯ ============ */

  if(document.body.classList.contains('phone')){const s=$('#slide');if(s)s.removeAttribute('style');scheduleFit();return;}
  const nb=$('#navbar'), nh=nb?nb.offsetHeight:54;
  const w=innerWidth,h=Math.max(280,innerHeight-nh);

  const sl=$('#slide');
  if(sl){sl.style.transform=`scale(${SCALE})`;sl.style.width='1280px';sl.style.height='720px';}
  scheduleFit();
}

const SHOTS={
 cheb:[['board','Чебышёв: чем больше опытов, тем уже коридор, в котором сидит почти вся выборка','.two > .card','0','beforeend','wide']],
 dice:[['dice','Одиночный бросок — шум. Тысяча бросков — своя тишина: найди число сам','.card','0','wrap','']],
 bern:[['coins','Бернулли вёл тетрадь: десятки тысяч бросков, отмеченных чёрточками','.two > .card','1','beforeend','wide']],
 ins:[['ship','Морская страховка: сотни мелких рисков складываются в предсказуемую сумму','.card','0','wrap','']],
 'th0.1':[['poll','Уличный опрос XIX века: анкетёр с журналом и очередь горожан','.rvwrap','0','beforeend','big']],
 'th1.0':[['toss','Пять орлов подряд не меняют шанс шестого броска: монетка не помнит прошлого','.rvwrap','0','beforeend','big']],
 'th1.1':[['tally','Сотни заполненных анкет — и доля перестаёт прыгать','.rvwrap','0','beforeend','big']],
 'th0.2':[['roulette','Лесенка ставок 1, 2, 4, 8, 16, 32: один проигрыш съедает весь выигрыш','.card','match:Европейская рулетка','beforeend','huge']],
};
function shotKey(sl){return sl.m!==undefined&&sl.m!==null?sl.k+'.'+sl.m:sl.k;}
function shotHTML(k,cap,cls){const src=PIC[k];if(!src)return '';
  return `<figure class="shot ${cls||''}"><span class="fr"><img src="${src}" alt="${(cap||'').replace(/"/g,'&quot;')}"></span><span class="scrolhint">↕ прокрутите</span>${cap?`<figcaption>${cap}</figcaption>`:''}</figure>`;}
/* рамки с прокруткой: помечаем data-sc, чтобы авто-подгонка не считала скрытую часть картинки */
function markScroll(root){
  root.querySelectorAll('.shot .fr').forEach(fr=>{
    const sc=fr.scrollHeight-fr.clientHeight>3;
    if(sc)fr.setAttribute('data-sc','1');else fr.removeAttribute('data-sc');
  });
}
function placeShots(b){
  const list=SHOTS[shotKey(SL[idx])];if(!list)return;
  list.forEach(([k,cap,sel,pick,pos,cls])=>{
    const els=[...b.querySelectorAll(sel)];if(!els.length)return;
    let host=null;
    if(pick.startsWith('match:')){const t=pick.slice(6);host=els.find(e=>(e.innerText||'').includes(t))||els[els.length-1];}
    else if(pick==='last')host=els[els.length-1];
    else host=els[+pick]||els[0];
    if(!host)return;
    if(pos==='wrap'){
      if(host.querySelector('.shotwrap'))return;
      const w=document.createElement('div');w.className='shotwrap';
      while(host.firstElementChild)w.appendChild(host.firstElementChild);
      host.appendChild(w);
      const d=document.createElement('div');d.innerHTML=shotHTML(k,cap,cls);
      host.appendChild(d.firstElementChild);
      host.classList.add('has-shot');
      return;
    }
    host.insertAdjacentHTML(pos||'beforeend',shotHTML(k,cap,cls));
    host.classList.add('shot-host');
  });
}

/* «Теория» и «Разбор»: блок доказательств одной сеткой — без пустых колонок */
function decorate(b){
  const sl=SL[idx];
  if(sl.k!=='th0'&&sl.k!=='th1')return;
  const head=b.querySelector('.shead'),rw=b.querySelector('.rvwrap');
  if(!rw)return;
  const cells=[];
  const cpic=[...b.children].find(e=>e!==head&&e!==rw&&e.classList.contains('cpic'));
  if(cpic){b.removeChild(cpic);cells.push(cpic)}
  const shot=rw.querySelector(':scope>.shot');
  if(shot){rw.removeChild(shot);cells.push(shot)}
  [...b.children].filter(e=>e!==head&&e!==rw).forEach(e=>cells.push(e));
  const host=cells.find(e=>e.classList&&e.classList.contains('card')&&e.querySelector('.shot'));
  if(host)host.classList.add('shot-side');
  if(!cells.length)return;
  const FCAP={'th0.0':'Два исхода и их вероятности: X = 0 и X = 1 по 0,5','th0.1':'Оценка ± 1,96σ: коридор вокруг доли, а не «точное число»','th0.2':'37 ячеек: 18 красных против 19 «не красных» — отсюда −1/37 на ставку','th1.2':'M(X) падает с каждым шагом лесенки: от −0,03 $ до −0,31 $ на сессию'};
  cells.forEach((e,i)=>{
    if(e.tagName!=='svg')return;
    const w=document.createElement('div');w.className='figbox';
    const svg=e.cloneNode(true);
    w.appendChild(svg);
    let has=false;
    const nx=cells[i+1];
    if(nx&&/^(P|DIV)$/.test(nx.tagName)&&(nx.classList.contains('hint')||nx.classList.contains('note'))){
      nx.classList.add('infbox');w.appendChild(nx);cells.splice(i+1,1);has=true;
    }
    if(!has)w.insertAdjacentHTML('beforeend',`<span class="fcap">${FCAP[shotKey(sl)]||'Схема к высказыванию: исход и его вероятность'}</span>`);
    e.replaceWith(w);cells[i]=w;
  });
  if(cells.length%2===1&&cells.length>1)cells[cells.length-1].classList.add('wide');
  const g=document.createElement('div');g.className='thgrid';
  b.appendChild(g);cells.forEach(e=>g.appendChild(e));
  g.querySelectorAll('.quiz').forEach(q=>q.classList.add('wide'));
}
/* таблицы: подписываем ячейки заголовками столбцов (для карточного вида на телефоне) */
/* «живая» строка в таблице вариантов сессии (слайд 35): подставляем текущее k из симулятора */
function fillLiveTable(root){
  const el=root.querySelector('#vtK');if(!el)return;
  const k=S.s3?S.s3.k:6,q=19/37,L=2**k-1,pl=q**k,E=1-(38/37)**k;
  const set=(id,v)=>{const n=root.querySelector(id);if(n)n.textContent=v;};
  set('#vtK',k);set('#vtWin',pc(1-pl));set('#vtLose',L);set('#vtLoseP',pc(pl,2));set('#vtM',f(E,3).replace('$',''));
}
function prepTables(root){
  root.querySelectorAll('table').forEach(t=>{
    if(t.dataset.plab)return;
    t.dataset.plab='1';
    t.classList.add('ptable');
    const rows=[...t.rows];if(!rows.length)return;
    const head=rows[0];
    const ths=[...head.cells];
    const isHead=ths.length>1&&ths.every(c=>c.tagName==='TH');
    if(isHead){
      head.classList.add('phead');
      const heads=ths.map(c=>c.textContent.replace(/\s+/g,' ').trim());
      rows.slice(1).forEach(r=>[...r.cells].forEach((c,i)=>{
        if(heads[i]&&c.tagName!=='TH')c.setAttribute('data-l',heads[i]);
      }));
    }else{
      t.classList.add('pkv');
    }
  });
}
function renderSlide(){
  const sl=SL[idx];
  if(document.body.classList.contains('phone')){const v=$('#viewport');if(v)v.scrollTop=0;}
  const slide=$('#slide');
  slide.dataset.i=idx;
  slide.dataset.k=sl.k||'';
  slide.classList.remove('th-open');
  if(window.__bgShuffle&&Math.random()<.99)window.__bgShuffle();
  slide.innerHTML=`<div class="head"><span class="hand sec-l">${sl.sec}</span><span class="pgn">${idx+1} / ${SL.length}</span></div><div class="body fade" id="body"></div>`;
  if(NAV){slide.classList.remove('go-r','go-l');void slide.offsetWidth;slide.classList.add(NAV>0?'go-r':'go-l');NAV=0;}
  const body=$('#body');
  const fit=document.createElement('div');fit.className='fit';body.appendChild(fit);
  sl.render(fit);
  placeShots(fit);
  decorate(fit);
  prepTables(fit);
  try{fillLiveTable(fit);}catch(e){}
  markScroll(fit);
  animateBars(slide);
  obs.disconnect();obs.observe(body,{childList:true,subtree:true,characterData:true});
  setTimeout(scheduleFit,650);setTimeout(scheduleFit,1150);setTimeout(scheduleFit,1750);
  $('#cnt').textContent=`${idx+1} / ${SL.length}`;
  $('#secname').textContent=sl.sec;
  $('#bar').style.width=((idx+1)/SL.length*100)+'%';
  $('#prev').disabled=idx===0;
  $('#next').disabled=idx===SL.length-1;
  $('#next').textContent=idx===SL.length-1?'Конец':'Далее →';
  scheduleFit();
}
let NAV=0;
function go(d){
  const n=Math.max(0,Math.min(SL.length-1,idx+d));
  if(n===idx)return;
  idx=n;NAV=d;renderSlide();
}
$('#prev').onclick=()=>go(-1);
$('#next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='range')return;
  if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(1);}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-vote],[data-open],[data-op],[data-desc],[data-cs],[data-reveal],[data-qo],[data-rv],#resetVotes');
  if(!t)return;
  const d=t.dataset;
  if(d.go!==undefined){go(+d.go);return;}
  if(d.vote!==undefined){S.votes[SL[idx].m+1]=d.vote;save('pm_votes_v3',S.votes);renderSlide();return;}
  if(d.open!==undefined){S.rev[d.open]=true;save('pm_rev_v3',S.rev);renderSlide();return;}
  if(d.rv!==undefined){const x=t.parentElement.querySelector('.rvbody');x.hidden=false;t.remove();$('#slide').classList.add('th-open');animateBars(x);try{thTuck();}catch(e){}scheduleFit();setTimeout(()=>{try{thTuck();}catch(e){}scheduleFit();},520);setTimeout(scheduleFit,1500);return;}
  if(d.op!==undefined){
    const cards=$$('.opin');
    cards.forEach((c,i)=>setTimeout(()=>c.classList.add('show'),i*350));
    t.parentElement.style.display='none';
    return;
  }
  if(t.id==='resetVotes'){S.votes={};S.rev={};save('pm_votes_v3',S.votes);save('pm_rev_v3',S.rev);renderSlide();return;}
  if(d.desc!==undefined){const x=t.parentElement.querySelector('.desc');x.hidden=!x.hidden;t.textContent=x.hidden?'Что здесь проверяем? ▶':'Скрыть ▲';return;}
  if(d.cs!==undefined){
    const k=+d.cs;
    if(k===0)CS.walks=[];
    else{CS.walks.forEach(w=>w.fresh=false);for(let i=0;i<k;i++)CS.walks.push({pts:walkPts(100),fresh:true});}
    renderSlide();return;
  }
  if(d.reveal!==undefined){const p=t.parentElement.querySelector('.ans');if(p)p.hidden=!p.hidden;t.textContent=p&&p.hidden?'Показать ответ':'Скрыть ответ';return;}
  if(d.qo!==undefined){
    const quiz=t.closest('.quiz');
    if(quiz.dataset.done)return;
    quiz.dataset.done='1';
    const ok=d.ok==='1';
    t.classList.add(ok?'ok':'bad');
    if(ok)confetti(30);
    $$('.qopt',quiz).forEach(o=>{if(o.dataset.ok==='1')o.classList.add('ok');});
    quiz.querySelector('.qfb').innerHTML=(ok?'<b>Верно.</b> ':'<b>Не совсем.</b> ')+quiz.dataset.exp;
    return;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='reflTxt'){S.refl.txt=e.target.value;save('pm_refl_v5',S.refl);}});
window.addEventListener('resize',()=>{fitSlide();scheduleFit();});
addEventListener('orientationchange',()=>{setTimeout(()=>{fitSlide();scheduleFit();},260);});
/* тач-навигация: свайп влево/вправо по пустому месту слайда */
(function(){
  const vp=$('#viewport');if(!vp)return;
  let x0=0,y0=0,t0=0,live=false;
  const skip=t=>!!(t&&t.closest&&t.closest('button,input,select,textarea,label,.wheel,.wheelwrap,#cnwrap,#s1canvas,#dcwrap,.chips,.pl,.mf'));
  vp.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch'||skip(e.target))return;
    x0=e.clientX;y0=e.clientY;t0=Date.now();live=true;
  },{passive:true});
  vp.addEventListener('pointerup',e=>{
    if(!live)return;live=false;
    const dx=e.clientX-x0,dy=e.clientY-y0,dt=Date.now()-t0;
    if(Math.abs(dx)>58&&Math.abs(dx)>2.1*Math.abs(dy)&&dt<900){go(dx<0?1:-1);}
  },{passive:true});
  vp.addEventListener('pointercancel',()=>{live=false;},{passive:true});
  const hx=$('#rothintX');
  if(hx)hx.onclick=()=>{document.body.classList.add('hinted');save('pm_phone_hint',1);const v=$('#viewport');if(v)v.style.setProperty('--hintres','0px');scheduleFit();};
  if(store('pm_phone_hint',0)===1)document.body.classList.add('hinted');
  const fab=$('#zoomFab');
  const phoneCapable=()=>matchMedia('(pointer:coarse)').matches&&Math.min(innerWidth,innerHeight)<=520;
  function paintFab(){
    if(!fab)return;const p=document.body.classList.contains('phone');
    fab.textContent=p?'🖥':'📱';
    fab.title=p?'Проекторный вид: слайд целиком':'Телефонная вёрстка: крупный текст, одна колонка';
    fab.setAttribute('aria-label',fab.title);
  }
  window.__setLayout=function(mode){
    document.body.classList.toggle('phone',mode==='phone');
    save('pm_layout',mode);
    const sl=$('#slide');if(sl)sl.removeAttribute('style');
    const f=$('#body .fit');if(f)f.removeAttribute('style');
    const v=$('#viewport');if(v)v.scrollTop=0;
    paintFab();fitSlide();scheduleFit();renderSlide();
  };
  if(fab)fab.onclick=()=>window.__setLayout(document.body.classList.contains('phone')?'canvas':'phone');
  paintFab();  if(window.pgFabSync)pgFabSync();
  if(!store('pm_layout',null)&&phoneCapable()&&!document.body.classList.contains('phone'))window.__setLayout('phone');
  matchMedia('(pointer:coarse)').addEventListener&&matchMedia('(pointer:coarse)').addEventListener('change',()=>{
    if(!store('pm_layout',null))window.__setLayout(phoneCapable()?'phone':'canvas');});
})();
fitSlide();
renderSlide();
</script>
