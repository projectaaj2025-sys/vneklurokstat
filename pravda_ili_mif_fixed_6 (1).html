<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Правда или миф? Закон больших чисел</title>
<style>
*{box-sizing:border-box}
:root{--paper:#f7f4ec;--ink:#2d2a26;--red:#e2473f;--yel:#f6d54a;--blue:#4f9fd8;--green:#2f9e6e;--muted:#6f675e;--navh:54px}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);background-image:linear-gradient(rgba(60,50,30,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(60,50,30,.07) 1px,transparent 1px);background-size:26px 26px;color:var(--ink);font:20px/1.6 "Segoe UI",Ubuntu,Roboto,system-ui,sans-serif}
.hand{font-family:"Segoe Print","Comic Sans MS","Bradley Hand","Ink Free","Marker Felt",cursive}
h1,h2,h3{font-weight:400}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;color:rgba(38,54,74,.17);font:italic 26px/1.1 "Cambria Math","STIX Two Math","Latin Modern Math",Cambria,Georgia,"Times New Roman",serif;white-space:nowrap;opacity:0;animation:flLife 13s ease-in-out infinite;will-change:transform,opacity;letter-spacing:.2px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.fl.pen{color:rgba(92,62,40,.15)}
.fl.chalk{color:rgba(45,42,38,.13)}
@keyframes flLife{
 0%{opacity:0;transform:translate(0,14px) rotate(-7deg) scale(.82)}
 12%{opacity:1;transform:translate(-3px,4px) rotate(-2deg) scale(1)}
 46%{opacity:.92;transform:translate(-12px,-16px) rotate(2deg) scale(1.03)}
 80%{opacity:.55;transform:translate(-22px,-40px) rotate(5deg) scale(1.07)}
 100%{opacity:0;transform:translate(-30px,-62px) rotate(8deg) scale(1.12)}
}
@media (prefers-reduced-motion:reduce){.fl{animation-duration:26s}}

/* оболочка слайдов: фиксированный холст 1280x720, без скроллинга, масштабируется под окно */
#viewport{position:fixed;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:1;overflow:hidden;touch-action:pan-x pan-y pinch-zoom}
#slide{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;width:1280px;height:720px;margin:-360px 0 0 -640px;padding:14px 42px 16px;overflow:hidden;transform-origin:50% 50%}
#navbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:14px;padding:0 18px env(safe-area-inset-bottom,0px);background:rgba(247,244,236,.97);border-top:2px solid var(--ink)}
#navbar .prog{flex:1 1 40px;min-width:24px;height:10px;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
#navbar .prog i{display:block;height:100%;width:0;background:var(--yel);transition:width .4s}
#navbar .sec{flex:0 1 auto;min-width:0;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#navbar .cnt{font-size:15px;min-width:56px;text-align:right;flex:0 0 auto}

.head{display:flex;justify-content:space-between;align-items:center;height:40px;margin-bottom:10px}
.sec-l{font-size:28px;color:#7a5510}
.pgn{font-size:18px;color:var(--muted)}
.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:visible}
.fit{position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:16px;transform-origin:0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.rst{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.rst .rstep{display:flex;flex-direction:column;gap:5px;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:10px 14px;box-shadow:4px 4px 0 rgba(45,42,38,.12);cursor:pointer;transition:transform .2s,background .2s;animation:fadeUp .5s both}
.rst .rstep:nth-child(2){animation-delay:.1s}
.rst .rstep:nth-child(3){animation-delay:.2s}
.rst .rstep:hover{transform:translateY(-3px) rotate(-.5deg)}
.rst .rstep.done{background:#eaf7ee}
.rstep .rno{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--yel);border:2px solid var(--ink);font:700 16px "Segoe Print","Comic Sans MS",cursive}
.rstep h4{margin:0;font-size:19px;font-weight:700;line-height:1.3}
.rstep p{margin:0;font-size:15px;line-height:1.45}
.rstep .rex{font-size:15px;color:var(--muted);border-left:3px solid #d9cfa9;padding-left:8px;line-height:1.4}
.rstep .rtick{margin-top:auto;align-self:flex-start;font-size:15px;padding:3px 12px;border:2px solid var(--ink);border-radius:30px;background:#fff}
.rstep.done .rtick{background:var(--green);color:#fff}
.rbar{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:17px}
.rbar .rb2{flex:1;height:16px;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.rbar .rb2 i{display:block;height:100%;width:0;background:var(--yel);transition:width .45s}
#body img{max-height:270px;width:auto;max-width:100%;object-fit:contain}
/* теория открыта → шапка сжимается, текст теории получает больше места (и остаётся крупным) */
.th-open .shead.full{padding:8px 22px}
.th-open .shead .lab{font-size:17px}
.th-open .shead.full .st{font-size:22px;margin-top:0;line-height:1.25}
.th-open .rvwrap>p.hint{display:none}
.th-open #slide>.head,#slide.th-open>.head{display:none}
#slide.th-open{padding-top:26px}
.th-open .fit>svg{max-height:136px!important;max-width:560px!important}
#slide.th-open .shead .lab{display:none}
#slide.th-open .theory .card p{margin:3px 0}
.th-open .theory .card{padding:10px 16px 12px}
.th-open .cpic{padding:5px 12px;margin-top:2px}
.th-open .cpic .cphoto img{width:88px;max-height:104px}
.th-open .fit{gap:9px}
.th-open .rvwrap{gap:8px;flex:0 0 auto!important}
.th-open .theory{gap:9px}
.th-open .theory .card{padding:14px 22px 16px}
.th-open .theory{gap:9px}
.th-open .theory .card{padding:10px 16px}
.th-open .theory .card h3{font-size:20px;margin-bottom:4px}
.th-open .theory p{margin:5px 0}
.th-open .theory .tbl{font-size:16px;margin-top:6px}
.rvwrap{align-items:stretch!important}
.rvwrap>svg,#body .fit>svg{max-width:840px!important;max-height:300px!important;height:auto!important;display:block!important;margin:4px auto!important}
#body .fit>svg text{font-size:16px}
.rvwrap>svg text{font-size:17px}
#rlwheel .wres{display:none}
#rlwheel .wheelwrap{width:256px;height:256px}
#rlwheel .wheel{width:256px!important;height:256px!important}
.rlwrap .card{display:flex;flex-direction:column;justify-content:center}
.fade{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{position:relative;background:#fff;border:2px solid var(--ink);border-radius:4px;padding:22px 32px;box-shadow:5px 5px 0 rgba(45,42,38,.1)}
.card h3{margin:0 0 10px;font-size:30px;text-decoration:underline;text-underline-offset:6px}
.card h3.nu{text-decoration:none}
.card p{margin:10px 0;line-height:1.5}
.kraft{background:linear-gradient(160deg,#d9b27c,#c39458);position:relative;box-shadow:0 6px 14px rgba(0,0,0,.18);border-radius:3px;color:#3a2a18}
.kraft::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.5px) 0 0/7px 7px;pointer-events:none;border-radius:3px}
.hero{padding:34px 48px;transform:rotate(-.5deg);margin-top:8px}
.hero h1{margin:0;font-size:80px;line-height:1.05;text-align:center;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:10px;animation:fadeUp .8s both}
.hero .sub{text-align:center;font-size:34px;margin:16px 0 4px}
.tape{position:absolute;width:150px;height:34px;opacity:.9;z-index:2;pointer-events:none}
.tape.y{background:repeating-linear-gradient(45deg,#f6d54a 0 9px,#f0c531 9px 18px)}
.tape.b{background-color:#bfe0f5;background-image:linear-gradient(rgba(79,159,216,.7) 2px,transparent 2px),linear-gradient(90deg,rgba(79,159,216,.7) 2px,transparent 2px);background-size:9px 9px}
.tape.p{background:rgba(240,162,176,.85)}
.tape.g{background:rgba(63,163,122,.75)}
.pin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a8f,#d32f2f 55%,#7d1616);box-shadow:0 4px 5px rgba(0,0,0,.35);z-index:3}
.plane{position:absolute;right:16px;top:-22px;width:104px;z-index:3;animation:fly 7s ease-in-out infinite;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.2))}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(-36px,12px) rotate(5deg)}}

.shead{background:#fffdf7;border:2px solid var(--ink);border-radius:4px;padding:16px 28px;box-shadow:4px 5px 0 rgba(45,42,38,.12);position:relative}
.shead.full{padding:22px 36px}
.shead .lab{font-size:24px;color:#7a5510}
.shead .st{font-size:28px;line-height:1.35;margin:4px 0 0}
.shead.full .st{font-size:40px;margin-top:8px}
.btn{font:inherit;cursor:pointer;flex:0 0 auto;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:40px;padding:14px 28px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;font-size:20px;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.big2{font-size:28px;padding:18px 38px}
.btn.sm{font-size:18px;padding:10px 20px}
.btn.on{background:var(--yel)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.votes{display:flex;flex-wrap:wrap;gap:16px;margin:8px 0}
.hint{color:var(--muted);font-size:18px;margin:6px 0}
.note{position:relative;background:#fff8d6;border:2px dashed #c9a24a;border-radius:6px;padding:12px 18px}
.bias{background:#ffe9e6;border:2px solid var(--red);border-radius:8px;padding:16px 20px}
.bar{flex:1;height:20px;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.7,.3,1)}
.pr{background:#f0c64a}
.pm{background:#4f9fd8}
.brow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:15px}
.brow span{width:100px}
.brow b{width:110px;text-align:right}
.prow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:16px}
.prow span{width:70px}
.prow b{width:50px;text-align:right}

/* формулы: нативный MathML */
math{font-size:24px}
.mf{background:#faf7ef;border-left:4px solid var(--red);padding:12px 18px;border-radius:4px;margin:12px 0;overflow:visible}
.kpi{background:#faf7ef;border:1.5px dashed #b9ab92;border-radius:8px;padding:8px 14px;margin:8px 0;font-size:19px}
.kpi sup{font-size:14.5px}

/* мнения */
.opins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opin{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:18px 22px;opacity:0;transform:translateY(14px) rotate(-.4deg);transition:opacity .5s,transform .5s;box-shadow:4px 4px 0 rgba(45,42,38,.1)}
.opin.show{opacity:1;transform:none}
.opin .who{font-family:"Segoe Print","Comic Sans MS",cursive;font-size:26px;color:#7a5510}
.opin .q{font-size:20px;margin:6px 0}
.opin .real{font-size:18px;background:#eef6fb;border-left:3px solid var(--blue);padding:8px 12px;margin-top:8px}
.opin .real b{color:var(--ink)}
.ph{background:repeating-linear-gradient(45deg,#f4f1e9 0 10px,#ebe6da 10px 20px);border:2px dashed #b9ab92;border-radius:6px;min-height:118px;display:flex;align-items:center;justify-content:center;color:#9a8f7c;font-family:"Segoe Print",cursive;font-size:24px}

/* теория */
.theory{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.theory .card h3{font-size:21px}
.theory .wide{grid-column:1/-1}
.seq{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.cc{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f0c64a 60%,#d9a52b);border:2px solid #b98a2a;font:700 18px Georgia,serif;color:#7a5510;animation:pop .5s both}
.cc:nth-child(2){animation-delay:.1s}.cc:nth-child(3){animation-delay:.2s}.cc:nth-child(4){animation-delay:.3s}.cc:nth-child(5){animation-delay:.4s}
.cc.q{background:#fff;color:var(--red);border-color:var(--red);animation:blink 1.2s infinite}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.25}}
.quiz{border:2px dashed var(--ink);border-radius:8px;padding:10px 14px;background:#fffdf5}
.qopt{display:block;width:100%;text-align:left;font:inherit;font-size:23px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:13px 16px;margin:8px 0;cursor:pointer}
.qopt:hover{background:#fff8d6}
.qopt.ok{background:#c9f0d8}
.qopt.bad{background:#ffd3cf}
.qfb{margin-top:10px;font-size:18px;min-height:26px}

/* вердикт */
.stamp{display:inline-block;font:700 64px "Segoe Print","Comic Sans MS",cursive;color:var(--red);border:6px solid var(--red);border-radius:14px;padding:0 24px;transform:rotate(-8deg);animation:stamp .65s cubic-bezier(.2,.8,.3,1) both;flex-shrink:0}
@keyframes stamp{0%{transform:scale(2.6) rotate(-20deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.check .ans{background:#eaf7ef;border-left:4px solid var(--green);padding:7px 11px;border-radius:4px;margin:6px 0 0}
.mark{display:inline-block;padding:4px 12px;border-radius:14px;border:2px solid var(--ink);font-size:16px;background:#fff}
.mark.ok{background:#c9f0d8}.mark.bad{background:#ffd3cf}

/* симуляторы */
.coinwrap{perspective:600px;height:96px;display:flex;align-items:center;justify-content:center}
.coin{width:78px;height:78px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.7,.3,1)}
.face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font:700 30px Georgia,serif;color:#7a5510;border:5px solid #b98a2a;background:radial-gradient(circle at 35% 30%,#fff3b0,#f0c64a 55%,#d9a52b)}
.face.back{transform:rotateX(180deg);background:radial-gradient(circle at 35% 30%,#f2f2f2,#bdbdbd 60%,#8e8e8e);border-color:#666;color:#333}
.vis{min-height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.wheelwrap{position:relative;width:190px;height:190px;margin:0 auto}
.wheel{width:180px;height:180px;display:block;margin:4px auto 0;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.2))}
.wheel .rot{transform-origin:120px 120px}
.ptr{position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid var(--red);z-index:2}
.wres{text-align:center;font-size:18px;min-height:24px}
.recent{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.rc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font: 700 13.5px sans-serif;border:2px solid var(--ink)}
.rc.y{background:#f0c64a;color:#6b4d0c}.rc.g{background:#8e8e8e}
.rc.r{background:#d8453c}.rc.k{background:#2b2b2b}
.rc2{display:inline-block;padding:3px 9px;border-radius:14px;margin:3px;font-size:15.5px;border:2px solid var(--ink);animation:fadeUp .4s both}
.rc2.w{background:#e7f6ec}.rc2.l{background:#fde9e7}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.chart svg{width:100%;height:70px;border:2px solid var(--ink);border-radius:6px;background:#fff;display:block}
.axis{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:3px}
.strip{position:relative;height:110px;margin:12px 0 0;border:2px solid var(--ink);border-radius:6px;background:repeating-linear-gradient(90deg,#fff 0 calc(10% - 1px),#e8e4da calc(10% - 1px) 10%);overflow:hidden}
.truth{position:absolute;top:0;bottom:0;width:3px;background:var(--red);transform:translateX(-1px)}
.band1{position:absolute;top:0;bottom:0;background:rgba(47,158,110,.45)}
.band3{position:absolute;top:0;bottom:0;background:rgba(246,213,74,.35)}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--blue);border:1.5px solid var(--ink);transform:translateX(-50%)}
.drop{animation:drop .5s ease-out}
@keyframes drop{from{opacity:0;margin-top:-30px}to{opacity:1;margin-top:0}}
.sl{display:block;margin-top:6px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--red);margin:4px 0}
.pl{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pl i{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:18px;margin-top:10px}
.tbl td,.tbl th{border:1.5px solid #bbb;padding:8px 12px;text-align:center}
.tbl tr.hi td{background:#fff1a8;font-weight:700}
.tbl td.l{text-align:left}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:10px}
.tile{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:18px;text-align:center;box-shadow:4px 4px 0 rgba(45,42,38,.12);animation:fadeUp .5s both}
.tile b{display:block;font-size:24px;font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:400}
.tile .n{display:inline-block;width:40px;height:40px;line-height:40px;border-radius:50%;background:var(--yel);border:2px solid var(--ink);font-weight:700;margin-bottom:8px}

/* рефлексия: стол с полями */
.table{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px}
.field{position:relative;height:230px;border:3px solid #fff;outline:3px solid var(--ink);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;cursor:pointer;padding:18px;transition:transform .1s}
.field:hover{transform:translateY(-3px)}
.field .t{font-size:30px;font-family:"Segoe Print","Comic Sans MS",cursive}
.field .d{font-size:19px;margin-top:8px;line-height:1.45}
.field.r{background:#d8453c}.field.k{background:#2b2b2b}.field.z{background:#2f9e6e}
.pchip{position:absolute;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#f6d54a 55%,#b98a2a);border:3px dashed #fff;box-shadow:0 3px 6px rgba(0,0,0,.4);animation:pop .45s both;pointer-events:none}
.refl-msg{margin-top:16px;padding:16px 20px;border-radius:8px;border:2px dashed var(--ink);background:#fbfaf6;animation:fadeUp .4s both;font-size:20px}
ol{margin:10px 0;padding-left:28px}
ol li{margin:8px 0}
ul.b{margin:10px 0;padding-left:26px}
ul.b li{margin:8px 0}

/* уменьшение текста в симуляторах, чтобы всё было видно */
.slide-sim .card{padding:12px 16px}
.slide-sim .kpi{margin:3px 0;padding:4px 10px}
.slide-sim .rc{width:21px;height:21px;font-size:13px}
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qrow .qopt{margin:0}
.pred{margin:6px 0 4px;padding:8px 12px}
.pred .pq{font-size:17px;margin:0 0 4px}
.descbox{margin-top:6px}
.desc{background:#eef6fb;border-left:3px solid var(--blue);padding:8px 12px;border-radius:4px;font-size:16px;margin:8px 0 0}
.lvl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lvl .btn{font-size:15px;padding:5px 11px}
.lvl .btn.on{background:var(--yel)}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border-bottom:1px dashed #cbbfa6}
.rrow:last-of-type{border-bottom:none}
.rrow .rt{font-size:17px;flex:1}
#reflTxt{width:100%;font:inherit;font-size:20px;border:2px solid var(--ink);border-radius:8px;padding:12px 14px;background:#fffdf5;resize:none;height:96px;color:var(--ink)}

#body .thgrid .figbox{justify-content:center;gap:14px}
#body .thgrid .figbox svg{max-height:232px!important;max-width:660px!important;width:auto}
#body .thgrid .figbox .fcap,#body .thgrid .figbox .infbox{font-size:17.5px}

.roulcard .hint{font-size:19px;line-height:1.42}

/* ===== конец 11d ===== */

/* ===== раунд 11e: слайды высказываний — воздух распределяется между блоками ===== */
#slide[data-k="th0"] #body .fit,#slide[data-k="th1"] #body .fit{justify-content:space-evenly;gap:0}
#slide[data-k="th0"].th-open #body .fit,#slide[data-k="th1"].th-open #body .fit{justify-content:center;gap:8px}
/* ===== конец 11e ===== */

/* ===== раунд 11f: телефон — фото в столбик, подпись снизу ===== */
body.phone #body .thgrid .shot{flex-direction:column;align-items:center;gap:8px}
body.phone #body .thgrid .shot .fr{max-width:100%}
body.phone #body .thgrid .shot img{max-height:300px!important}
body.phone #body .thgrid .shot figcaption{flex:0 0 auto;min-width:0;text-align:center;font-size:16px}
/* ===== конец 11f ===== */

/* ===== раунд 11g: шпаргалка крупнее, прогноз-вопрос крупнее ===== */
#slide[data-k="form"] .tbl td.fm math{font-size:26px!important}
#slide[data-k="form"] .tbl td.fm{padding:13px 12px}
#slide[data-k="form"] .tbl th{font-size:20px}
#slide[data-k="form"] .card h3{font-size:31px}
#slide[data-k="form"] ol li{font-size:20.5px;line-height:1.7}
#slide[data-k="form"] ol{margin-top:4px}
#body .quiz.pred{font-size:18px}
#body .quiz.pred .qopt{font-size:19px;padding:9px 14px}
#slide[data-k="dice"] .card>p:first-of-type,#slide[data-k="dice"] .card .hint{font-size:17.5px}
/* ===== конец 11g ===== */

/* ===== раунд 11h: телефон — номер слайда не под кнопкой меню, шпаргалка без мусорной шапки ===== */
body.phone .head{padding-right:0}
body.phone .head .pgn{margin-right:110px}
body.phone #slide[data-k="form"] .tbl tr:first-child{display:none}

body.phone #slide[data-k="form"] .tbl td.fm{border-top:1px solid #e2d9c6;border-bottom:1px solid #e2d9c6}
/* ===== конец 11h ===== */

/* ===== раунд 12: «слайд на всю страницу» на телефоне + подстройка под экран в ландшафте ===== */
#pgFab{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:62px;z-index:7;width:46px;height:46px;
  border-radius:50%;border:1.5px solid rgba(21,26,31,.22);background:rgba(255,255,255,.88);color:var(--ink);
  font:700 21px var(--mono);align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);
  box-shadow:0 3px 10px rgba(20,25,30,.14)}
body.phone #pgFab{display:flex;background:#fffdf7;border-color:var(--ink);opacity:.94}
body.phone #pgFab:active{transform:scale(.94)}
body.phone #viewport{overscroll-behavior:contain;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + var(--hintres,0px))}
/* подогнанный слайд: вертикальный центр, прокрутка только если впритык не влез */
body.phone.pgfit #slide{min-height:100%!important;display:flex;flex-direction:column;padding:6px 12px 10px}
body.phone.pgfit #body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
body.phone.pgfit #body .fit{position:static;width:auto;justify-content:flex-start}
body.phone.pgfitlock #viewport{overflow:hidden}
@media (orientation:landscape) and (max-height:560px){
  body.phone #slide{max-width:min(880px,96%);padding:6px 12px 8px}
  body.phone.pgfit #slide{padding:4px 12px 4px}
  body.phone .head{min-height:36px;align-items:center}
  body.phone .head .pgn{margin-right:86px}

}
/* ===== конец раунда 12 ===== */

/* ландшафт: широкий экран работает в две колонки — так слайд занимает весь экран, а не узкую полосу */
@media (orientation:landscape) and (max-height:560px){
  body.phone.lsc #body .fit{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:9px 14px}
  body.phone.lsc #body .fit>*{flex:1 1 calc(50% - 7px);min-width:0;max-width:calc(50% + 1px)}
  body.phone.lsc #body .fit>*.lwide{flex:1 1 100%;max-width:100%}
  body.phone.lsc #body .fit>svg,body.phone.lsc #body .fit>canvas{flex:1 1 100%;max-width:100%}
}

/* кнопки в углу телефона: компактные, но с зоной нажатия 50px; шапка сдвинута, чтобы их не подрезать */
body.phone #pgFab,body.phone #zoomFab{width:34px;height:34px;top:calc(5px + env(safe-area-inset-top,0px));font-size:15px;border-width:1.2px}
body.phone #pgFab{right:46px}
body.phone #pgFab svg,body.phone #zoomFab svg{width:17px;height:17px}
body.phone #pgFab::before,body.phone #zoomFab::before{content:'';position:absolute;inset:-8px}
body.phone .head{min-height:38px}
body.phone .head .pgn{margin-right:86px}
/* подсказка про кнопки видна и в телефонной вёрстке — и не перекрывает содержимое */
body.phone #rothint{display:flex;font-size:14.5px}
body.phone.hinted #rothint{display:none}
/* в ландшафте фото не обрезаем: кадрируем по высоте экрана и ставим по центру рамки */
body.phone.lsc #body .fit .shot img{width:auto!important;max-width:100%!important;height:auto!important;max-height:236px!important;object-fit:contain!important;margin-inline:auto!important}
body.phone.lsc #body .fit .shot{text-align:center}
body.phone.lsc #body .fit .shot .cap,body.phone.lsc #body .fit .shot figcaption{text-align:left}
@media (orientation:landscape) and (max-height:560px){body.phone #rothint{display:none!important}} /* в ландшафте подсказка съедает слишком много высоты */

/* ==================== РАУНД 13 ==================== */
/* 16 и 25: подпись под портретом «свидетеля урока» */
#body .cpic .cpic-t{font-size:20px}
#body .cpic .cpic-lead{font-size:21px!important;line-height:1.45}
body.phone #body .cpic .cpic-t{font-size:17px}
body.phone #body .cpic .cpic-lead{font-size:17.5px!important;line-height:1.4}
/* кнопка «Открыть теорию» больше не растягивается на полслайда */
#slide[data-k="th0"] #body .rvwrap>.btn.big2,#slide[data-k="th1"] #body .rvwrap>.btn.big2{
  align-self:center;justify-self:center;width:max-content;max-width:82%;min-height:0;
  padding:13px 32px;font-size:25px;line-height:1.2;flex:0 0 auto}
/* 35: карточка графика — на всю ширину, сам график и подпись рядом, колонки не пустуют */
@media (min-width:1000px){
 #slide[data-i="34"] #body .thgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);
   gap:10px 28px;align-items:center;text-align:left;padding:16px 24px}
 #slide[data-i="34"] #body .thgrid .mwrap{max-width:100%}
 #slide[data-i="34"] #body .figbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);
   gap:10px 28px;align-items:center;text-align:left;padding:18px 24px}
 #slide[data-i="34"] #body .figbox .fcap,#slide[data-i="34"] #body .thgrid .hint{margin:0}
 #slide[data-i="34"] #body .figbox .fcap{font-size:20px}
}
body.phone #slide[data-i="34"] #body .thgrid{display:block;text-align:left}
body.phone #body .thgrid .mwrap{margin:0 auto 8px}
#body .figbox .mwrap,#body .thgrid .mwrap{display:block;width:100%;max-width:780px;min-width:0;margin:2px auto 0}
#body .figbox svg.mchart,#body .thgrid svg.mchart{width:100%!important;max-width:100%!important;height:auto!important;max-height:none!important;display:block;margin:0;align-self:auto;min-width:0;flex:0 1 auto}
/* 25/34: теория и подписи крупнее (закрытое состояние) */
#slide[data-i="24"] #body .card p,#slide[data-i="33"] #body .card p{font-size:22px;line-height:1.5}
#slide[data-i="24"] #body .fcap,#slide[data-i="33"] #body .fcap{font-size:18.5px}
#slide[data-i="33"] #body .card .hint,#slide[data-i="34"] #body .card .hint{font-size:19.5px}
#slide[data-i="34"] #body .shead .st{font-size:36px}
#slide[data-i="34"] #body .figbox .hint,#slide[data-i="33"] #body .figbox .hint{font-size:19.5px}
/* 48: таблица фиксации и чек-лист — крупнее за счёт плотных строк */
#slide[data-i="47"] #body .form{margin:12px 0 0}
#slide[data-i="47"] #body ul.check>li{font-size:20.5px;padding:9px 12px}
#slide[data-i="47"] #body ul.check>li label{font-size:20.5px}
/* 4: реquisites в панели комикса */
#body .cpanel .cprops svg{max-width:100%;height:auto}
#body .cpanel .cprops em{font-size:16.5px;font-style:normal}
/* 17/26 и другие открытые теории: мозаика из двух колонок вместо пустых ячеек сетки */
.thcols{display:flex;gap:0 22px;align-items:stretch;flex:1 1 auto;min-height:0;width:100%}
.thcol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.thcol>*{margin:0!important}
.thcol .shot{display:flex;align-items:center;gap:14px}
@media (min-width:1000px){
 #slide[data-k="th0"].th-open #body .fit>.rvwrap,
 #slide[data-k="th1"].th-open #body .fit>.rvwrap{padding-left:0;padding-right:0}
 #slide[data-k="th0"].th-open #body .shot.big .fr,
 #slide[data-k="th1"].th-open #body .shot.big .fr{width:auto!important;max-width:46%!important;flex:0 1 auto;min-height:0}
 #slide[data-k="th0"].th-open #body .shot.big .fr img,
 #slide[data-k="th1"].th-open #body .shot.big .fr img{height:auto!important;width:auto!important;max-width:100%!important;max-height:390px!important;object-fit:contain!important}
 #slide[data-k="th0"].th-open #body .shot.big,
 #slide[data-k="th1"].th-open #body .shot.big{max-height:none!important}
 #slide[data-k="th0"].th-open #body .shot.big .figc,
 #slide[data-k="th1"].th-open #body .shot.big .figc,
 #slide[data-k="th0"].th-open #body .shot.big FIGCAPTION,
 #slide[data-k="th1"].th-open #body .shot.big figcaption{flex:1 1 auto}
 #slide[data-k="th0"].th-open #body .shot.big figcaption,
 #slide[data-k="th1"].th-open #body .shot.big figcaption{font-size:18px}
}
/* 48: чек-лист — в две колонки, чтобы не было пустой правой половины карточки */

 #slide[data-i="47"] #body .card ol{columns:2;column-gap:40px;padding-left:22px}
 #slide[data-i="47"] #body .card ol>li{break-inside:avoid;padding-right:6px}
 #slide[data-i="47"] #body .card ol>li+li{margin-top:10px}
}
/* портрет «свидетеля урока» в открытой теории — крупнее (без кроя, contain) */
#slide[data-k="th0"].th-open #body .cpic .cphoto img,
#slide[data-k="th1"].th-open #body .cpic .cphoto img{width:132px;max-height:168px;object-fit:contain}
#slide[data-k="th0"].th-open #body .cpic .cphoto,
#slide[data-k="th1"].th-open #body .cpic .cphoto{padding:6px}
/* 34/35: подписи под графиком и пояснение — крупнее */
#slide[data-i="34"] #body .figbox .infbox,#slide[data-i="33"] #body .figbox .infbox{font-size:19.5px;line-height:1.42}
#slide[data-i="34"] #body .rvwrap>.hint{font-size:19px}

/* ==================== РАУНД 14 ==================== */
/* (1) текст не должен вылезать за границы своего блока: flex/grid-дети получают min-width:0 */
#body .shead>*,#body .card>*,#body .two>*,#body .thgrid>*,#body .thcol>*,#body .rvwrap>*,
#body .figbox>*,#body .quiz>*,#body .roulhead>*,#body .tiles>*,#body .cprops>*,
#body .shead.full .st,#body .cpic>*{min-width:0}
#body .shead.full .st,#body .shead.comic .st,#body .shead .st{width:100%;max-width:100%;overflow-wrap:break-word}
#body .card>.hint,#body .card>p,#body .shot figcaption{overflow-wrap:break-word}
#body .figbox>svg{width:100%;height:auto;max-width:100%;max-height:172px}
/* (2) слайд 34: фото — колонкой справа, «37 ячеек…» во всю ширину и крупно, рисунок без обрезки */
#slide[data-i="33"] #body .card.roulcard{display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"head shot" "hint shot";gap:4px 16px;align-items:center;padding:8px 16px 10px}
#slide[data-i="33"] #body .card.roulcard>.roulhead{grid-area:head;min-width:0;font-size:22px}
#slide[data-i="33"] #body .card.roulcard>.hint,#slide[data-i="33"] #body .card.roulcard>p.hint{
  grid-area:hint;font-size:26px!important;line-height:1.3;margin:0}
#slide[data-i="33"] #body .card.roulcard .shot{grid-area:shot;display:block;margin:0;max-width:206px;min-width:0}
#slide[data-i="33"] #body .card.roulcard .shot .fr{display:block;flex:none}
#slide[data-i="33"] #body .card.roulcard .shot img{width:100%;height:auto;max-height:146px;object-fit:contain}
#slide[data-i="33"] #body .card.roulcard .shot figcaption{max-width:none;text-align:center;margin-top:5px;
  font-size:18.5px;line-height:1.28}
#slide[data-i="33"] #body .thgrid>.figbox{align-self:start;min-width:0;padding:8px 14px;gap:5px}
#slide[data-i="33"] #body .figbox>svg{max-height:150px}
#slide[data-i="33"] #body .figbox .fcap,#slide[data-i="33"] #body .figbox figcaption{font-size:19px;line-height:1.26;margin:0}
#slide[data-i="33"] #body .rvwrap>.hint{font-size:20px!important}
#slide[data-i="33"] #body .quiz.wide h3{font-size:22px;margin:0 0 2px}
#slide[data-i="33"] #body .quiz.wide .qopt,#slide[data-i="34"] #body .quiz.wide .qopt,
#slide[data-i="33"] #body .card .qopt,#slide[data-i="34"] #body .card .qopt{padding:8px 14px;margin:5px 0;font-size:23px}
/* (4) слайд 48: плотнее воздух — крупнее шрифт (автоподгонка иначе съедает прирост) */
#slide[data-i="47"] #body .fit{padding:12px 0}
#slide[data-i="47"] #body .card .hand{margin-bottom:4px}
#slide[data-i="47"] #body .card ol>li{padding:4px 6px;font-size:23px;line-height:1.3}
#slide[data-i="47"] #body .card ol>li+li{margin-top:4px}
#slide[data-i="47"] #body .card ol{margin-top:6px}
/* (4b) слайд 48: таблица-шпаргалка (.tbl) — крупнее, строки плотнее */
#slide[data-i="47"] #body .fit>.card:first-child{padding:12px 18px 14px}
#slide[data-i="47"] #body .tbl,#slide[data-i="47"] #body .tbl td,#slide[data-i="47"] #body .tbl th{
  font-size:26px!important;line-height:1.2}
#slide[data-i="47"] #body .tbl th{font-size:23px!important;letter-spacing:.2px}
#slide[data-i="47"] #body .tbl tr>*+*{padding-left:14px}
#slide[data-i="47"] #body .tbl td,#slide[data-i="47"] #body .tbl th{padding:3px 10px}
#slide[data-i="47"] #body .tbl *{font-size:1em}
#slide[data-i="47"] #body .tbl .mathf{font-size:1.06em}
#slide[data-i="47"] #body .tbl td:first-child{font-size:24px!important}
/* (5) подписи на графике слайда 35 — читаемые */
#body svg.mchart text{font-size:18px!important}
#body svg.mchart text[font-size="13"]{font-size:17px!important}
/* (14b) карточки рефлексии: рубашка с ответом и кнопками влезает целиком, текст не режется */
#body .rcard{height:134px}
#body .rcard .rq,#body .rf>div:first-child{font-size:19.5px!important;line-height:1.3}
#body .rb p{font-size:15.5px;line-height:1.28;margin-bottom:3px}
#body .rb{padding:5px 9px 7px}
#body .rf{padding:8px 10px 6px;justify-content:space-between}
body.phone #body .rcard{height:auto}
body.phone #body .rf,body.phone #body .rb{position:static;inset:auto}
/* (14f) телефон: карточки рефлексии не распухают за край, таблица-шпаргалка влезает */
body.phone #body .rgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
body.phone #body .rgrid>.rcard,body.phone #body .rcard>.rin{min-width:0}
body.phone #body .rbtns .btn{white-space:normal;overflow-wrap:anywhere;padding:3px 7px;font-size:14px}
body.phone #body .rcard .rtap,body.phone #body .rcard .re{max-width:100%}
body.phone #slide[data-i="47"] #body .tbl,body.phone #slide[data-i="47"] #body .tbl td,
body.phone #slide[data-i="47"] #body .tbl th{font-size:19px!important}
body.phone #slide[data-i="47"] #body .tbl .mathf{font-size:.9em!important}
body.phone #slide[data-i="47"] #body .fit>.card:first-child{padding:8px 10px 10px}
body.phone #body .tbl td,body.phone #body .tbl math{max-width:100%;overflow-wrap:anywhere}
body.phone #slide[data-i="47"] #body .tbl math,.phone #slide[data-i="47"] #body .tbl mfenced,
.phone #slide[data-i="47"] #body .tbl mfrac,.phone #slide[data-i="47"] #body .tbl mstyle{font-size:15px!important}
body.phone #slide[data-i="47"] #body .tbl tr>*+*{padding-left:7px}

/* ==================== РАУНД 15: плавная анимация формул на фоне ==================== */
/* два слоя движения (носитель + наклон внутри), замкнутый цикл без рывка на стыке,
   прозрачность постоянная — фонари не мигают; только transform (GPU), layout не дёргается */
#floaters{translate:var(--px,0px) var(--py,0px);transition:translate .6s linear}
.fl{opacity:.72;animation:flFloat var(--dur,44s) cubic-bezier(.37,0,.63,1) var(--dly,0s) infinite!important;
  animation-timing-function:cubic-bezier(.37,0,.63,1)!important;animation-fill-mode:none!important}
.fl>i{display:inline-block;font-style:italic;will-change:transform;
  animation:flSway calc(var(--dur,44s)*.62) cubic-bezier(.37,0,.63,1) var(--dly,0s) infinite}
.fl.chalk{opacity:.66}
@keyframes flFloat{
  0%{transform:translate3d(0,0,0)}
  20%{transform:translate3d(-13px,-19px,0)}
  45%{transform:translate3d(-31px,-6px,0)}
  70%{transform:translate3d(-17px,15px,0)}
  88%{transform:translate3d(-5px,7px,0)}
  100%{transform:translate3d(0,0,0)}
}
@keyframes flSway{
  0%{transform:translate3d(0,0,0) rotate(-1.8deg) scale(1)}
  28%{transform:translate3d(9px,-7px,0) rotate(1.4deg) scale(1.045)}
  56%{transform:translate3d(-8px,5px,0) rotate(-.8deg) scale(1.015)}
  80%{transform:translate3d(4px,8px,0) rotate(1deg) scale(.975)}
  100%{transform:translate3d(0,0,0) rotate(-1.8deg) scale(1)}
}
/* перестановка на resize — плавно доезжает, без скачка */
.fl.flmv{transition:left 2.2s cubic-bezier(.33,0,.2,1),right 2.2s cubic-bezier(.33,0,.2,1),top 2.2s cubic-bezier(.33,0,.2,1),font-size 2.2s ease}
/* сам контейнер дышит очень медленно, без «отскока» на стыке */
#floaters{animation:bgGlide 128s cubic-bezier(.42,0,.58,1) infinite!important}
@keyframes bgGlide{
  0%{transform:translate3d(-14px,9px,0) rotate(-.32deg)}
  50%{transform:translate3d(14px,-11px,0) rotate(.32deg)}
  100%{transform:translate3d(-14px,9px,0) rotate(-.32deg)}
}
@media (prefers-reduced-motion:reduce){
  #floaters,.fl,.fl>i{animation:none!important}
  .fl{opacity:.5}.fl>i{transform:none}
}
/* на телефоне фон остаётся статичным — экономим кадры */
body.phone #floaters{display:none}

/* ===== конец 8g ===== */

/* ===== раунд 9 ===== */
/* фон: медленный дрейф, без вспышек */
.fl{animation-name:flDrift;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;animation-fill-mode:both}
@keyframes flDrift{from{opacity:.42;transform:translate(0,0) rotate(-3deg) scale(1)}to{opacity:.78;transform:translate(-22px,-26px) rotate(3deg) scale(1.04)}}
/* слайд 50: кружок без «+» */
.skills .sk .skc{min-width:26px;height:26px;border:2px solid #cbbfa8;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.skills .sk.on .skc{background:var(--green);border-color:var(--green)}
/* обложка комикса: панель тянется, пустого низа нет */
.ccover-txt{margin-top:6px}
.ccover .cpanel{flex:1;min-height:220px}
.ccover .cbody{justify-content:center}
/* реквизит — отдельной полосой */
.cprops{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;padding:2px 6px 0;border-top:1px dashed #ddd2bb;margin-top:2px}
.cprops .chips,.cprops .cprop{flex-wrap:wrap;justify-content:center;gap:5px 8px}
.cprops em{font-size:15.5px;text-align:center;flex:1 1 100%}
.cbody .csfx{margin:0 2px 0 auto;align-self:flex-end}
/* «Теория»/«Разбор»: сетка доказательств */
.thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;align-items:start;width:100%;margin-top:2px}
.thgrid>.wide{grid-column:1/-1}
.thgrid .cpic{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:14px;padding:12px 14px!important;text-align:left}
.thgrid .cpic .cpic-t{position:static;transform:none;margin:0 0 6px;max-width:none;display:inline-block}
.thgrid .cpic .cphoto{flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
#body .thgrid .cpic .cphoto img{width:138px!important;height:auto!important;max-height:184px!important;object-fit:cover}
.thgrid .cpic .cphoto figcaption{font-size:15px}
.thgrid .cpic p{font-size:17.5px;line-height:1.4}
.thgrid .shot{display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:7px}
#body .thgrid .shot img{width:100%!important;height:auto!important;max-height:296px!important;object-fit:cover}
#slide.th-open #body .thgrid .shot img,#slide.th-open .thgrid .shot img{max-height:186px!important}
.thgrid .shot figcaption{text-align:left;font-size:16px;line-height:1.3}
.thgrid>svg{width:100%!important;max-width:540px;height:auto!important;max-height:236px!important;justify-self:center;align-self:center}
/* карточка с вложенным кадром */
.card.shot-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:8px 24px;align-items:center}
.card.shot-side>*{grid-column:1;min-width:0}
.card.shot-side .shot{grid-column:2;grid-row:1/span 6;justify-self:stretch}
#body .card.shot-side .shot img{width:100%!important;max-width:none!important;height:auto!important;max-height:212px!important;object-fit:cover}
/* симулятор удвоения: низ карточки в три колонки */
.s3grid{align-items:center!important}
.s3band{display:grid;grid-template-columns:minmax(0,188px) minmax(0,320px) minmax(0,1fr);gap:10px 22px;align-items:center;width:100%;margin-top:12px}
.s3band .ladder{margin:0}
.s3band #s3wf{width:100%;max-width:320px;margin:0}
/* слайд 38: крупнее и без пустого низа у карточек */
#slide[data-k="cans"] .two{align-items:stretch}
#slide[data-k="cans"] .card{display:flex;flex-direction:column;justify-content:space-evenly;gap:10px}
#slide[data-k="cans"] .card h3{font-size:27px!important}
#slide[data-k="cans"] .card p,#slide[data-k="cans"] .card li{font-size:20px!important;line-height:1.45}
#slide[data-k="cans"] .card ul.b{font-size:20px!important}
#slide[data-k="cans"] .note{font-size:18.5px!important}
#slide[data-k="cans"] .mf{font-size:19px!important}
/* шпаргалка: колонка формул по центру, MathML не слипается */
#slide[data-k="form"] .tbl td.fm{width:34%;text-align:center;line-height:1;white-space:normal;padding:13px 10px!important}
#slide[data-k="form"] .tbl td.fm math{font-size:19px}
#slide[data-k="form"] .tbl td:first-child,#slide[data-k="form"] .tbl td:last-child{line-height:1.4}
body.phone #slide[data-k="form"] .tbl td.fm{line-height:1.1;text-align:left}
@media(max-width:760px){
 .thgrid{grid-template-columns:minmax(0,1fr)}
 .s3band{grid-template-columns:minmax(0,1fr)}
 #body .thgrid .shot img{max-height:300px!important}
 .cprops em{font-size:15px}
}
body.phone .thgrid{grid-template-columns:minmax(0,1fr)}
body.phone .thgrid .cpic{flex-direction:column;align-items:center;text-align:center}
/* ===== конец 9 ===== */

/* ===== раунд 9c: карточка свидетеля, размер кадров, схема ===== */
.thgrid .cpic{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);grid-template-areas:"tag tag" "pic txt";gap:8px 16px;align-items:center;padding:14px 16px!important}
.thgrid .cpic .cpic-t{grid-area:tag;justify-self:start}
.thgrid .cpic .cphoto{grid-area:pic}
.thgrid .cpic p{grid-area:txt;font-size:17.5px}
#body .thgrid .cpic .cphoto img{width:140px!important;max-height:186px!important}
#body .thgrid .shot img{max-height:238px!important}
.thgrid>svg{height:246px!important;max-height:246px!important;align-self:stretch}
.thgrid>.wide+svg,.thgrid>svg{background:#fffdf7;border:2px dashed #ddd2bb;border-radius:6px;padding:6px 10px}
body.phone .thgrid .cpic{grid-template-columns:minmax(0,1fr);grid-template-areas:"tag" "pic" "txt";justify-items:center;text-align:center}
/* ===== конец 9c ===== */

/* ===== раунд 9d ===== */
.figbox{background:#fffdf7;border:2px solid var(--ink);border-radius:4px;padding:14px 16px 11px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;box-shadow:4px 4px 0 rgba(45,42,38,.1);min-height:0}
.figbox svg{width:100%!important;max-width:520px;height:auto!important;max-height:180px!important}
.figbox .fcap{font-size:16.5px;line-height:1.35;color:#5d5348;text-align:center}
.thgrid .figbox{align-self:stretch}
/* ===== конец 9d ===== */

/* ===== раунд 9e ===== */
.figbox .infbox{margin:0!important;font-size:16.5px!important;line-height:1.4;color:#4a443c;text-align:center;padding:0 6px}
/* ===== конец 9e ===== */

/* ===== раунд 10: комикс на телефоне — панель = высота контента, без пустых дыр ===== */
body.phone .cpages{flex:0 0 auto!important;align-content:start;grid-auto-rows:min-content;gap:12px}
body.phone .cpanel{min-height:0;padding:0 11px 11px;gap:9px}
body.phone .cpanel:has(.cprops),body.phone .cpanel:has(.cstamp){padding-bottom:12px}
body.phone .crow{flex:0 0 auto;align-items:flex-start}
body.phone .cbody{flex:1 1 auto;justify-content:flex-start;gap:11px;min-height:0}
body.phone .cbub{font-size:16.5px;line-height:1.44;padding:10px 13px 11px}
body.phone .cwho2{flex:0 0 70px;margin-top:0}
body.phone .cwho2 .cfig-svg{width:66px;height:76px}
body.phone .cwho2 b{font-size:15.5px}
body.phone .ccap{font-size:16.5px;line-height:1.3;padding:5px 11px 6px}
body.phone .chook{margin-top:2px;font-size:16px;padding:8px 11px}
body.phone .csfx{position:static;display:inline-block;margin:0 0 0 auto;transform:rotate(-4deg)}
body.phone .cpanel:has(.csfx){padding-bottom:11px}
body.phone .cprops{padding-top:8px}
body.phone .cnote,.body.phone .cmath{font-size:16px}
body.phone .cprop svg{max-width:210px}
body.phone .cprop em{font-size:16px}
body.phone .cstamp{margin-top:2px}
/* ===== конец 10 ===== */

/* ===== раунд 10b: персонаж и реплика в одну строку, саунд-эффект по центру ===== */
body.phone .crow{flex-wrap:nowrap;align-items:flex-start;gap:9px}
body.phone .cwho2{flex:0 0 60px;margin-top:3px}
body.phone .cwho2 .cfig-svg{width:58px;height:68px}
body.phone .cwho2 b{font-size:15px;line-height:1.22}
body.phone .cbody{flex:1 1 auto;min-width:0}
body.phone .csfx{display:block;width:max-content;max-width:100%;margin:3px auto 0;font-size:17px}
body.phone .cbub{margin:0}
body.phone .cprops{margin-top:2px}
/* ===== конец 10b ===== */

/* ===== раунд 10c: жёлтая шапка панели не наезжает на букву панели ===== */
body.phone .ccap{margin:0 0 0 -2.5px}
body.phone .cline{align-items:flex-start;gap:6px}
body.phone .cnum{flex:0 0 auto;margin-top:6px}
/* ===== конец 10c ===== */

/* ===== раунд 11: фото без обрезки, карточка рулетки, шапка-облачко, шпаргалка, фон ===== */
/* фото в сетке теории: целиком, без object-fit:cover */
#body .thgrid .shot{flex-direction:row;align-items:center;gap:14px;flex-wrap:nowrap}
#body .thgrid .shot .fr{flex:0 1 auto;max-width:64%}
#body .thgrid .shot img,#body .thgrid .shot.big img,#body .thgrid .shot.huge img{width:auto!important;max-width:100%!important;height:auto!important;max-height:308px!important;object-fit:contain!important;background:#efe9dc}
#slide.th-open #body .thgrid .shot img{max-height:230px!important}
#body .thgrid .shot figcaption{flex:1 1 160px;min-width:140px;max-width:none;text-align:left;font-size:16.5px;line-height:1.34}
/* карточка с фото справа (34) — тоже без кадрирования */
#body .card.shot-side .shot{flex-direction:column;align-items:center;gap:7px}
#body .card.shot-side .shot img{width:auto!important;max-width:100%!important;height:auto!important;max-height:236px!important;object-fit:contain!important}
.card.shot-side{grid-template-columns:minmax(0,1fr) minmax(0,320px)!important}
.roulcard .roulhead{display:flex;align-items:center;gap:12px}
.roulcard .roulhead b{font-size:20px;text-decoration:underline;text-underline-offset:3px}
.roulcard .hint{font-size:17.5px}
/* шапка-облачко: текст не заходит под персонажа */
#slide .shead.comic,#slide.th-open .shead.comic,#slide .shead.full.comic{padding-right:76px}
body.phone #slide .shead.comic{padding-right:52px}
/* теория: карточки равномерно, без пустого низа */
#body .thgrid>.card{justify-content:space-evenly}
#body .thgrid .quiz{margin-top:2px}
/* шпаргалка (48): крупнее и без обрезки дробей/корней */
#slide[data-k="form"] .tbl{font-size:19px!important}
#slide[data-k="form"] .tbl th{font-size:19px;padding:9px 10px}
#slide[data-k="form"] .tbl td{padding:10px 11px;line-height:1.5;vertical-align:middle}
#slide[data-k="form"] .tbl math{font-size:22px}
#slide[data-k="form"] .card h3{font-size:30px}
#slide[data-k="form"] .card p,#slide[data-k="form"] ol li{font-size:19.5px}
/* фон: плавное непрерывное дрейфование, без мигания */
#floaters{inset:-5%;animation:bgPan 92s linear infinite alternate}
@keyframes bgPan{from{transform:translate3d(-16px,11px,0) rotate(-.4deg)}to{transform:translate3d(16px,-13px,0) rotate(.4deg)}}
.fl{animation-timing-function:linear!important;will-change:transform,opacity}
@keyframes flDrift{from{opacity:.40;transform:translate(0,0) rotate(-2.5deg) scale(1)}to{opacity:.74;transform:translate(-56px,-66px) rotate(2.5deg) scale(1.05)}}
/* 50: отметка не двигает список */
.skills .sk{transition:background-color .18s ease,border-color .18s ease}
.skills .sk.on{border-color:var(--green)}
.skills .sk:hover{transform:none}
/* ===== конец 11 ===== */

/* ===== раунд 11b: фото крупнее (всё ещё без кадрирования), формулы шпаргалки ===== */
#body .thgrid .cpic .cphoto img{object-fit:contain!important;background:#efe9dc}
#body .thgrid .shot img,#body .thgrid .shot.big img,#body .thgrid .shot.huge img{max-height:330px!important}
#slide.th-open #body .thgrid .shot img{max-height:286px!important}
#body .card.shot-side .shot img{max-height:266px!important}
.card.shot-side{grid-template-columns:minmax(0,1fr) minmax(0,336px)!important}
#slide[data-k="form"] .tbl td.fm math{font-size:23px!important}
#slide[data-k="form"] .tbl td.fm{padding:11px 12px;line-height:1.6}
/* ===== конец 11b ===== */

/* ===== раунд 11c: строки сетки ровные, пустоты снизу карточек нет ===== */
#body .thgrid{align-items:stretch}
#body .thgrid>.card{justify-content:space-evenly}
#body .card.shot-side{align-content:space-evenly}
#body .thgrid .figbox{justify-content:space-evenly;gap:16px}
#body .card.shot-side .shot img{height:236px!important;width:auto!important;max-width:100%!important;max-height:none!important;object-fit:contain!important}
#body .thgrid .shot img{max-height:352px!important}
#slide.th-open #body .thgrid .shot img{max-height:300px!important}
/* ===== конец 11c ===== */

/* ===== раунд 11d: плотные ячейки (без растягивания), схема крупнее ===== */
#body .thgrid{align-items:start}
#body .thgrid>.card{justify-content:flex-start;gap:12px}
#body .card.shot-side{align-content:center}
#body .thgrid .figbox{justify-content:center;gap:14px}
#body .thgrid .figbox svg{max-height:232px!important;max-width:660px!important;width:auto}
#body .thgrid .figbox .fcap,#body .thgrid .figbox .infbox{font-size:17.5px}
#body .thgrid .shot{align-items:center}
.roulcard .hint{font-size:19px;line-height:1.42}
.roulcard .roulhead b{font-size:21px}
.roulcard .roulhead img{box-shadow:2px 3px 0 rgba(45,42,38,.18)}
/* ===== конец 11d ===== */

/* ===== раунд 11e: слайды высказываний — воздух распределяется между блоками ===== */
#slide[data-k="th0"] #body .fit,#slide[data-k="th1"] #body .fit{justify-content:space-evenly;gap:0}
#slide[data-k="th0"].th-open #body .fit,#slide[data-k="th1"].th-open #body .fit{justify-content:center;gap:8px}
/* ===== конец 11e ===== */

/* ===== раунд 11f: телефон — фото в столбик, подпись снизу ===== */
body.phone #body .thgrid .shot{flex-direction:column;align-items:center;gap:8px}
body.phone #body .thgrid .shot .fr{max-width:100%}
body.phone #body .thgrid .shot img{max-height:300px!important}
body.phone #body .thgrid .shot figcaption{flex:0 0 auto;min-width:0;text-align:center;font-size:16px}
/* ===== конец 11f ===== */

/* ===== раунд 11g: шпаргалка крупнее, прогноз-вопрос крупнее ===== */
#slide[data-k="form"] .tbl td.fm math{font-size:26px!important}
#slide[data-k="form"] .tbl td.fm{padding:13px 12px}
#slide[data-k="form"] .tbl th{font-size:20px}
#slide[data-k="form"] .card h3{font-size:31px}
#slide[data-k="form"] ol li{font-size:20.5px;line-height:1.7}
#slide[data-k="form"] ol{margin-top:4px}
#body .quiz.pred{font-size:18px}
#body .quiz.pred .qopt{font-size:19px;padding:9px 14px}
#slide[data-k="dice"] .card>p:first-of-type,#slide[data-k="dice"] .card .hint{font-size:17.5px}
/* ===== конец 11g ===== */

/* ===== раунд 11h: телефон — номер слайда не под кнопкой меню, шпаргалка без мусорной шапки ===== */
body.phone .head{padding-right:0}
body.phone .head .pgn{margin-right:110px}
body.phone #slide[data-k="form"] .tbl tr:first-child{display:none}
body.phone #slide[data-k="form"] .tbl td{padding:10px 12px}
body.phone #slide[data-k="form"] .tbl td.fm{border-top:1px solid #e2d9c6;border-bottom:1px solid #e2d9c6}
/* ===== конец 11h ===== */

/* ===== раунд 12: «слайд на всю страницу» на телефоне + подстройка под экран в ландшафте ===== */
#pgFab{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:62px;z-index:7;width:46px;height:46px;
  border-radius:50%;border:1.5px solid rgba(21,26,31,.22);background:rgba(255,255,255,.88);color:var(--ink);
  font:700 21px var(--mono);align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);
  box-shadow:0 3px 10px rgba(20,25,30,.14)}
body.phone #pgFab{display:flex;background:#fffdf7;border-color:var(--ink);opacity:.94}
body.phone #pgFab:active{transform:scale(.94)}
body.phone #viewport{overscroll-behavior:contain;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + var(--hintres,0px))}
/* подогнанный слайд: вертикальный центр, прокрутка только если впритык не влез */
body.phone.pgfit #slide{min-height:100%!important;display:flex;flex-direction:column;padding:6px 12px 10px}
body.phone.pgfit #body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
body.phone.pgfit #body .fit{position:static;width:auto;justify-content:flex-start}
body.phone.pgfitlock #viewport{overflow:hidden}
@media (orientation:landscape) and (max-height:560px){
  body.phone #slide{max-width:min(880px,96%);padding:6px 12px 8px}
  body.phone.pgfit #slide{padding:4px 12px 4px}
  body.phone .head{min-height:36px;align-items:center}
  body.phone .head .pgn{margin-right:86px}

}
/* ===== конец раунда 12 ===== */

/* ландшафт: широкий экран работает в две колонки — так слайд занимает весь экран, а не узкую полосу */
@media (orientation:landscape) and (max-height:560px){
  body.phone.lsc #body .fit{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:9px 14px}
  body.phone.lsc #body .fit>*{flex:1 1 calc(50% - 7px);min-width:0;max-width:calc(50% + 1px)}
  body.phone.lsc #body .fit>*.lwide{flex:1 1 100%;max-width:100%}
  body.phone.lsc #body .fit>svg,body.phone.lsc #body .fit>canvas{flex:1 1 100%;max-width:100%}
}

/* кнопки в углу телефона: компактные, но с зоной нажатия 50px; шапка сдвинута, чтобы их не подрезать */
body.phone #pgFab,body.phone #zoomFab{width:34px;height:34px;top:calc(5px + env(safe-area-inset-top,0px));font-size:15px;border-width:1.2px}
body.phone #pgFab{right:46px}
body.phone #pgFab svg,body.phone #zoomFab svg{width:17px;height:17px}
body.phone #pgFab::before,body.phone #zoomFab::before{content:'';position:absolute;inset:-8px}
body.phone .head{min-height:38px}
body.phone .head .pgn{margin-right:86px}
/* подсказка про кнопки видна и в телефонной вёрстке — и не перекрывает содержимое */
body.phone #rothint{display:flex;font-size:14.5px}
body.phone.hinted #rothint{display:none}
/* в ландшафте фото не обрезаем: кадрируем по высоте экрана и ставим по центру рамки */
body.phone.lsc #body .fit .shot img{width:auto!important;max-width:100%!important;height:auto!important;max-height:236px!important;object-fit:contain!important;margin-inline:auto!important}
body.phone.lsc #body .fit .shot{text-align:center}
body.phone.lsc #body .fit .shot .cap,body.phone.lsc #body .fit .shot figcaption{text-align:left}
@media (orientation:landscape) and (max-height:560px){body.phone #rothint{display:none!important}} /* в ландшафте подсказка съедает слишком много высоты */

/* ==================== РАУНД 13 ==================== */
/* 16 и 25: подпись под портретом «свидетеля урока» */
#body .cpic .cpic-t{font-size:20px}
#body .cpic .cpic-lead{font-size:21px!important;line-height:1.45}
body.phone #body .cpic .cpic-t{font-size:17px}
body.phone #body .cpic .cpic-lead{font-size:17.5px!important;line-height:1.4}
/* кнопка «Открыть теорию» больше не растягивается на полслайда */
#slide[data-k="th0"] #body .rvwrap>.btn.big2,#slide[data-k="th1"] #body .rvwrap>.btn.big2{
  align-self:center;justify-self:center;width:max-content;max-width:82%;min-height:0;
  padding:13px 32px;font-size:25px;line-height:1.2;flex:0 0 auto}
/* 35: карточка графика — на всю ширину, сам график и подпись рядом, колонки не пустуют */
@media (min-width:1000px){
 #slide[data-i="34"] #body .thgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);
   gap:10px 28px;align-items:center;text-align:left;padding:16px 24px}
 #slide[data-i="34"] #body .thgrid .mwrap{max-width:100%}
 #slide[data-i="34"] #body .figbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);
   gap:10px 28px;align-items:center;text-align:left;padding:18px 24px}
 #slide[data-i="34"] #body .figbox .fcap,#slide[data-i="34"] #body .thgrid .hint{margin:0}
 #slide[data-i="34"] #body .figbox .fcap{font-size:20px}
}
body.phone #slide[data-i="34"] #body .thgrid{display:block;text-align:left}
body.phone #body .thgrid .mwrap{margin:0 auto 8px}
#body .figbox .mwrap,#body .thgrid .mwrap{display:block;width:100%;max-width:780px;min-width:0;margin:2px auto 0}

/* ==================== РАУНД 14 ==================== */
/* (1) текст не должен вылезать за границы своего блока: flex/grid-дети получают min-width:0 */
#body .shead>*,#body .card>*,#body .two>*,#body .thgrid>*,#body .thcol>*,#body .rvwrap>*,
#body .figbox>*,#body .quiz>*,#body .roulhead>*,#body .tiles>*,#body .cprops>*,
#body .shead.full .st,#body .cpic>*{min-width:0}
#body .shead.full .st,#body .shead.comic .st,#body .shead .st{width:100%;max-width:100%;overflow-wrap:break-word}
#body .card>.hint,#body .card>p,#body .shot figcaption{overflow-wrap:break-word}
#body .figbox>svg{width:100%;height:auto;max-width:100%;max-height:172px}
/* (2) слайд 34: фото — колонкой справа, «37 ячеек…» во всю ширину и крупно, рисунок без обрезки */
#slide[data-i="33"] #body .card.roulcard{display:grid;grid-template-columns:minmax(0,1fr) auto;
  grid-template-areas:"head shot" "hint shot";gap:4px 16px;align-items:center;padding:8px 16px 10px}

#slide[data-i="47"] #body .fit{padding:12px 0}

#slide[data-i="47"] #body .fit>.card:first-child{padding:12px 18px 14px}

body.phone #body .rgrid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

/* ==================== РАУНД 15: плавная анимация формул на фоне ==================== */
/* два слоя движения (носитель + наклон внутри), замкнутый цикл без рывка на стыке,
   прозрачность постоянная — фонари не мигают; только transform (GPU), layout не дёргается */
#floaters{translate:var(--px,0px) var(--py,0px);transition:translate .6s linear}
.fl{opacity:.72;animation:flFloat var(--dur,44s) cubic-bezier(.37,0,.63,1) var(--dly,0s) infinite!important;
  animation-timing-function:cubic-bezier(.37,0,.63,1)!important;animation-fill-mode:none!important}
.fl>i{display:inline-block;font-style:italic;will-change:transform;
  animation:flSway calc(var(--dur,44s)*.62) cubic-bezier(.37,0,.63,1) var(--dly,0s) infinite}
.fl.chalk{opacity:.66}
@keyframes flFloat{
  0%{transform:translate3d(0,0,0)}
  20%{transform:translate3d(-13px,-19px,0)}
  45%{transform:translate3d(-31px,-6px,0)}
  70%{transform:translate3d(-17px,15px,0)}
  88%{transform:translate3d(-5px,7px,0)}
  100%{transform:translate3d(0,0,0)}
}
@keyframes flSway{
  0%{transform:translate3d(0,0,0) rotate(-1.8deg) scale(1)}
  28%{transform:translate3d(9px,-7px,0) rotate(1.4deg) scale(1.045)}
  56%{transform:translate3d(-8px,5px,0) rotate(-.8deg) scale(1.015)}
  80%{transform:translate3d(4px,8px,0) rotate(1deg) scale(.975)}
  100%{transform:translate3d(0,0,0) rotate(-1.8deg) scale(1)}
}
/* перестановка на resize — плавно доезжает, без скачка */
.fl.flmv{transition:left 2.2s cubic-bezier(.33,0,.2,1),right 2.2s cubic-bezier(.33,0,.2,1),top 2.2s cubic-bezier(.33,0,.2,1),font-size 2.2s ease}
/* сам контейнер дышит очень медленно, без «отскока» на стыке */
#floaters{animation:bgGlide 128s cubic-bezier(.42,0,.58,1) infinite!important}
@keyframes bgGlide{
  0%{transform:translate3d(-14px,9px,0) rotate(-.32deg)}
  50%{transform:translate3d(14px,-11px,0) rotate(.32deg)}
  100%{transform:translate3d(-14px,9px,0) rotate(-.32deg)}
}
@media (prefers-reduced-motion:reduce){
  #floaters,.fl,.fl>i{animation:none!important}
  .fl{opacity:.5}.fl>i{transform:none}
}
/* на телефоне фон остаётся статичным — экономим кадры */
body.phone #floaters{display:none}


/* ===== раунд 14: правки по отзывам (формулы, фото на 7/9/17/25) ===== */
/* 1. Формулы: греческие буквы (mathvariant=normal) + крупный кегль на слайдах теорем */
#slide[data-k="cheb"] .mf math,#slide[data-k="bern"] .mf math{font-size:32px}
#slide[data-k="cheb"] .mf,#slide[data-k="bern"] .mf{padding:10px 18px;overflow-x:auto;overflow-y:hidden}
#slide[data-k="cheb"] .mf math[display="block"],#slide[data-k="bern"] .mf math[display="block"]{white-space:nowrap}
body.phone #slide[data-k="cheb"] .mf math,body.phone #slide[data-k="bern"] .mf math{font-size:22px}

/* 2. Слайд 7: «свидетель» крупнее и по центру колонки, а не мелкий слева */
#slide[data-i="6"] #body .card.shot-host{display:flex!important;flex-direction:column;gap:6px}
#slide[data-i="6"] #body .shot{align-items:center;gap:18px;margin:8px 0 0}
#slide[data-i="6"] #body .shot .fr{flex:0 0 auto;padding:6px 6px 0}
#slide[data-i="6"] #body .shot img,#slide[data-i="6"] #body .shot.wide img{height:256px!important;width:auto!important;max-width:100%!important;max-height:none!important;object-fit:contain!important}
#slide[data-i="6"] #body .shot figcaption{max-width:330px;font-size:17px;line-height:1.34}

/* 3. Слайды 9, 17, 25, 26: крупное фото БЕЗ внутренней прокрутки
      (на телефоне прокручивается сама страница, картинка едет вместе с ней) */
#slide[data-i="8"] #body .shot,
#slide[data-i="16"] #body .shot,
#slide[data-i="24"] #body .shot,
#slide[data-i="25"] #body .shot{display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;align-items:center!important;gap:9px!important;margin:2px 0 0;width:100%}

#slide[data-i="16"] #body .card.has-shot,
#slide[data-i="24"] #body .card.has-shot,
#slide[data-i="25"] #body .card.has-shot{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:8px!important}
#slide[data-i="8"] #body .card.has-shot>.shotwrap,
#slide[data-i="16"] #body .card.has-shot>.shotwrap,
#slide[data-i="24"] #body .card.has-shot>.shotwrap,
#slide[data-i="25"] #body .card.has-shot>.shotwrap{width:100%!important}
#slide[data-i="8"] #body .shot .fr,
#slide[data-i="16"] #body .shot .fr,
#slide[data-i="24"] #body .shot .fr,
#slide[data-i="25"] #body .shot .fr{width:100%!important;max-width:100%!important;flex:0 0 auto;max-height:none!important;height:auto!important;overflow:visible!important;padding:6px 6px 0}
#slide[data-i="8"] #body .shot img,#slide[data-i="8"] #body .shot.wide img,#slide[data-i="8"] #body .shot.big img,
#slide[data-i="16"] #body .shot img,#slide[data-i="16"] #body .shot.wide img,#slide[data-i="16"] #body .shot.big img,
#slide[data-i="24"] #body .shot img,#slide[data-i="24"] #body .shot.wide img,#slide[data-i="24"] #body .shot.big img,
#slide[data-i="25"] #body .shot img,#slide[data-i="25"] #body .shot.wide img,#slide[data-i="25"] #body .shot.big img{display:block;width:100%!important;max-width:100%!important;height:auto!important;max-height:330px!important;object-fit:cover!important;object-position:50% 55%;margin:0 auto}
#slide[data-i="8"] #body .shot figcaption,
#slide[data-i="16"] #body .shot figcaption,
#slide[data-i="24"] #body .shot figcaption,
#slide[data-i="25"] #body .shot figcaption{flex:0 0 auto!important;min-width:0!important;max-width:none!important;text-align:center;font-size:16.5px;line-height:1.3}
/* плашка «прокрутите» остаётся только там, где прокрутка реально есть */

body.phone #slide[data-i="8"] #body .shot .fr,
body.phone #slide[data-i="16"] #body .shot .fr,
body.phone #slide[data-i="24"] #body .shot .fr,
body.phone #slide[data-i="25"] #body .shot .fr{max-height:none!important;overflow:visible!important;padding:6px 6px 0}

body.phone #slide[data-i="16"] #body .shot img,

body.phone #slide[data-i="6"] #body .shot img{height:auto!important;width:100%!important}
/* 3b. открытая теория на этих слайдах — то же поведение */
#slide.th-open[data-i="16"] #body .fit .shot.big,
#slide.th-open[data-i="24"] #body .fit .shot.big,
#slide.th-open[data-i="25"] #body .fit .shot.big,
#slide.th-open[data-i="8"] #body .fit .shot.big{flex-direction:column!important;flex-wrap:nowrap!important;align-items:stretch!important;gap:9px!important}
#slide.th-open[data-i="16"] #body .fit .shot.big .fr,
#slide.th-open[data-i="24"] #body .fit .shot.big .fr,
#slide.th-open[data-i="25"] #body .fit .shot.big .fr,
#slide.th-open[data-i="8"] #body .fit .shot.big .fr{width:100%!important;max-width:100%!important;flex:0 0 auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}

#slide.th-open[data-i="16"] #body .fit .shot.big figcaption,
#slide.th-open[data-i="24"] #body .fit .shot.big figcaption,

#slide.th-open[data-i="8"] #body .fit .shot.big figcaption{flex:0 0 auto!important;max-width:none!important;text-align:center;font-size:16.5px}

/* 4. Таблицы 42 и 47 на телефоне: компактные строки «подпись — значение» */
body.phone #slide[data-i="41"] #body table.ptable td,
body.phone #slide[data-i="46"] #body table.ptable td{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 2px;font-size:16.5px;line-height:1.3}

body.phone #slide[data-i="46"] #body table.ptable td[data-l="Спор"]{display:block;font-size:18px;padding-bottom:4px;border-top:0!important}

/* ===== конец раунда 14 ===== */
/* 5. Телефон: карточки «текст + портрет» — в одну колонку, чтобы текст не сжимался */

body.phone .pflex .ptext{flex:0 1 auto;width:100%}

/* 6. Телефон: текст с формулами переносится по строкам, а не «уезжает» в бок */

  return{
    spinTo(x,dur){
      const j=ORDER.indexOf(x),step=360/37;
      let target=wRot+1440;
      target+=((((-j*step-target)%360)+360)%360);
      wRot=target;
      g.style.transition=`transform ${dur}s cubic-bezier(.15,.7,.2,1)`;
      g.style.transform=`rotate(${target}deg)`;
      const col=x===0?'зелёный 0':(RED.has(x)?'красное':'чёрное');
      setTimeout(()=>{const r=root.querySelector('#wres');if(r)r.innerHTML=`Выпало: <b>${x}</b> — ${col}`;},dur*1000);
    }
  };
}

const isSucc=(mode,v)=>mode==='coin'?v===1:RED.has(v);
const randOut=mode=>mode==='coin'?(Math.random()<0.5?1:0):Math.floor(Math.random()*37);
function flipCoin(ok){

function upd1(el){
  const st=S.s1,mode=st.mode,h=st.h[mode],N=h.length,coin=mode==='coin',sc=st.sc[mode];
  const p=coin?0.5:18/37;
  const succ=h.map(v=>isSucc(mode,v));
  const s=succ.filter(Boolean).length;
  let run=0,cnt=0,nxt=0;
  for(let i=0;i<N;i++){if(run>=5){cnt++;if(succ[i])nxt++;}run=succ[i]?run+1:0;}

    :`<div class="kpi">Пока пусто. Угадайте исход или нажмите +100.</div>`;
  $('#s1streak',el).innerHTML=cnt
    ?`Серий из 5 подряд: <b>${cnt}</b>. После такой серии следующий исход был «${coin?'орлом':'красным'}» в <b>${pc(nxt/cnt)}</b> случаев (теория: <b>${pc(p)}</b>). Серии — это случайность, а не закономерность.`
    :`Серий из 5 подряд пока нет. Накопите данные (+1000) и проверьте сами.`;
  const cells=h.slice(-100).map((v,i,a)=>`<i class="wf ${succ[N-a.length+i]?'s':'f'}${i===a.length-1?' last':''}"></i>`);
  while(cells.length<100)cells.push('<i class="wf"></i>');
  $('#s1wf',el).innerHTML=cells.join('');
  const box=$('#s1chart',el);
  if(N<2){box.innerHTML='<p class="hint">График доли появится после нескольких бросков. Ось X — логарифмическая.</p>';return;}
  const W=600,HH=90,step=Math.max(1,Math.ceil(N/400));
  let c=0;const pts=[];let lx=0,ly=0;
  for(let i=0;i<N;i++){
    if(succ[i])c++;
    if(i%step===0||i===N-1){const x=Math.log10(i+1)/Math.log10(N)*W;const y=HH-(c/(i+1))*HH;pts.push(x.toFixed(1)+','+y.toFixed(1));lx=x;ly=y;}
  }
  const yT=HH-p*HH;
  box.innerHTML=`<div class="cwrap"><svg viewBox="0 0 ${W} ${HH}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${yT}" y2="${yT}" stroke="#e2473f" stroke-width="2" stroke-dasharray="7 5"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#2d2a26" stroke-width="2.5"/></svg>
    <i class="dotp" style="left:${(lx/W*100).toFixed(2)}%;top:${(ly/HH*100).toFixed(2)}%"></i></div>
    <div class="axis"><span>доля «успехов»</span><span>красная линия — теория ${pc(p)}</span><span>бросков: 1 → ${N}</span></div>`;
}

const RBET=[

  {id:'zero', lab:'Зеро 0',   pay:35, hint:'шанс 1/37'}
];
const rlBet=id=>RBET.find(x=>x.id===id)||RBET[0];
function rlWins(bet,n){
  switch(bet){
    case 'red':  return RED.has(n);
    case 'black':return n!==0 && !RED.has(n);
    case 'even': return n!==0 && n%2===0;
    case 'odd':  return n%2===1;
    case 'low':  return n>=1 && n<=18;
    case 'high': return n>=19 && n<=36;
    case 'zero': return n===0;
  }
  return false;
}

function simS2(el){
  const st=S.s2;
  el.innerHTML=`<div class="card sim5">

    <div class="histwrap"><svg class="hist" id="s2svg" viewBox="0 0 600 170" preserveAspectRatio="none"></svg><div class="histph" id="s2ph">Гистограмма появится после первого опроса</div></div>
    <div class="axis" id="s2axis"></div>
    <div id="s2stats"></div>
  </div>`;
  $('#s2p',el).oninput=e=>{st.p=+e.target.value;st.est=[];$('#s2pv',el).textContent=st.p;drawS2(el);};
  $('#s2n',el).oninput=e=>{st.n=+e.target.value;st.est=[];$('#s2nv',el).textContent=st.n;drawS2(el);};
  $('#s2one',el).onclick=()=>{let m=0;for(let i=0;i<st.n;i++)if(Math.random()<st.p/100)m++;st.est.push(100*m/st.n);drawS2(el,1);};
  $('#s2hun',el).onclick=()=>{for(let k=0;k<100;k++){let m=0;for(let i=0;i<st.n;i++)if(Math.random()<st.p/100)m++;st.est.push(100*m/st.n);}drawS2(el,3);};
  $('#s2clr',el).onclick=()=>{st.est=[];drawS2(el);};

function drawS2(el,fresh=0){
  const st=S.s2,p=st.p/100,n=st.n,E=st.est,N=E.length;
  const sig=100*Math.sqrt(p*(1-p)/n);
  const W=Math.min(15,Math.max(3,4.2*sig));
  const xmin=Math.max(0,st.p-W),xmax=Math.min(100,st.p+W),NB=40,bw=(xmax-xmin)/NB;
  const cnt=new Array(NB).fill(0);
  E.forEach(e=>{let k=Math.floor((e-xmin)/bw);k=Math.max(0,Math.min(NB-1,k));cnt[k]++;});
  const Nc=Math.max(N,1);
  const pdf=x=>Math.exp(-0.5*((x-st.p)/sig)**2)/(sig*Math.sqrt(2*Math.PI));
  const exp=[];for(let i=0;i<NB;i++){const c=xmin+(i+.5)*bw;exp.push(Nc*bw*pdf(c));}
  const maxC=Math.max(1,...cnt,...exp);
  let bars='';
  for(let i=0;i<NB;i++){
    const c=xmin+(i+.5)*bw,h=cnt[i]/maxC*150;
    const col=Math.abs(c-st.p)<=1?'#8ed1a9':(Math.abs(c-st.p)<=3?'#f6d54a':'#e9e4d8');
    bars+=`<rect x="${i*15}" y="${160-h}" width="13" height="${h}" fill="${col}" stroke="#2d2a26" stroke-width="1"/>`;
  }
  const line=exp.map((v,i)=>`${i*15+7.5},${(160-v/maxC*150).toFixed(1)}`).join(' ');
  const xT=(st.p-xmin)/(xmax-xmin)*600;
  const ph=$('#s2ph',el);if(ph)ph.hidden=N>0;
  $('#s2svg',el).innerHTML=`${bars}<line x1="${xT}" x2="${xT}" y1="0" y2="160" stroke="#e2473f" stroke-width="2" stroke-dasharray="6 4"/>${N?`<polyline points="${line}" fill="none" stroke="#3b7dd8" stroke-width="2.5"/>`:''}<line x1="0" x2="600" y1="160" y2="160" stroke="#2d2a26" stroke-width="2"/>`;
  $('#s2axis',el).innerHTML=`<span>${f(xmin,1)}%</span><span>красная линия — настоящая поддержка ${st.p}%</span><span>${f(xmax,1)}%</span>`;
  const balls=E.slice(-6).map((e,k,a)=>{const pct=Math.max(0,Math.min(100,(e-xmin)/(xmax-xmin)*100));return `<i class="ball${k>=a.length-Math.min(fresh||1,a.length)?' drop':''}" style="left:${pct.toFixed(2)}%"></i>`;}).join('');
  $('#s2balls',el).innerHTML=balls;
  if(!N){$('#s2stats',el).innerHTML='<div class="kpi">Проведите опрос: каждый опрос — шарик, который падает в свою колонку гистограммы.</div>';return;}
  let w1=0,w3=0,mean=0;
  E.forEach(e=>{if(Math.abs(e-st.p)<=1)w1++;if(Math.abs(e-st.p)<=3)w3++;mean+=e;});
  mean/=N;
  let v=0;E.forEach(e=>v+=(e-mean)**2);
  const sdE=N>1?Math.sqrt(v/N):0;
  const P1=2*Phi(1/sig)-1,P3=2*Phi(3/sig)-1;
  $('#s2stats',el).innerHTML=`
    <div class="kpi">Опросов: <b>${N}</b>. В пределах ±1%: <b>${pc(w1/N,0)}</b> (теория ≈ ${pc(P1,0)}). В пределах ±3%: <b>${pc(w3/N,0)}</b> (теория ≈ ${pc(P3,0)})</div>
    <div class="kpi">Среднее оценок: <b>${f(mean)}%</b> (истина: ${st.p}%). Разброс σ по опытам: <b>${f(sdE)}%</b> (теория: ${f(sig)}%)</div>`;
}

/* --- 3. удвоение ставок: лесенка ставок, сетка сессий --- */
function buildTbl(el){
  const box=$('#s3tbl',el);if(!box)return;
  const k0=S.s3.k,q=19/37;
  let h='<tr><th>k</th><th>P(выигрыш 1 $)</th><th>Макс. проигрыш, $</th><th>P(проигрыш)</th><th>M(X), $</th><th>σ(X), $</th></tr>';
  for(let k=1;k<=10;k++){
    const L=2**k-1,pl=q**k,E=1-(38/37)**k,E2=(1-pl)+pl*L*L,sg=Math.sqrt(E2-E*E);
    h+=`<tr class="${k===k0?'hi':''}"><td>${k}</td><td>${pc(1-pl)}</td><td>${L}</td><td>${pc(pl,2)}</td><td>${f(E,3)}</td><td>${f(sg,2)}</td></tr>`;
  }
  box.innerHTML=h;
}
function drawLadder(el){
  const k=S.s3.k,top=2**(k-1);
  $('#s3lad',el).innerHTML=Array.from({length:k},(_,i)=>{
    const bet=2**i,h=10+bet/top*52;
    return `<div class="lad" data-i="${i}" style="height:${h.toFixed(0)}px"><span>${bet}</span></div>`;
  }).join('');
}
function upd3(el){
  const k=S.s3.k,q=19/37,L=2**k-1,pl=q**k;
  const E=1-(38/37)**k,E2=(1-pl)+pl*L*L,sg=Math.sqrt(E2-E*E);
  let h=`<div class="kpi">P(выиграть 1 $ за сессию) = <b>${pc(1-pl)}</b></div>
    <div class="kpi">Максимальный проигрыш: <b>${L} $</b> (ставки 1 + 2 + … + ${2**(k-1)})</div>
    <div class="kpi">Теория: M(X) = <b>${f(E,3)} $</b>, σ(X) = <b>${f(sg,2)} $</b></div>`;
  const m=S.s3.many;
  if(m&&m.k===k){
    h+=`<div class="kpi">1000 сессий: среднее <b>${f(m.mean,3)} $</b>, σ ≈ <b>${f(m.sd,2)} $</b>, выигрышей <b>${pc(m.wins)}</b></div>
    <div class="brow"><span>+1 $</span><div class="bar"><i class="pr" style="width:${(m.wins*100).toFixed(1)}%"></i></div><b>${pc(m.wins)}</b></div>
    <div class="brow"><span>−${L} $</span><div class="bar"><i class="pm" style="width:${((1-m.wins)*100).toFixed(1)}%"></i></div><b>${pc(1-m.wins)}</b></div>`;
  }
  $('#s3stats',el).innerHTML=h;
}

        <div id="s3stats"></div>

      <div class="note" id="s3note">Каждый квадрат — сессия: зелёный (+1 $), красный (−63 $). Ставки растут как лесенка, и один проигрыш съедает всё: на дистанции решает именно это, а не удача.</div>
    </div>
  </div>`;

  $('#s3one',el).onclick=()=>singleSession(el,wheel);
  $('#s3many',el).onclick=()=>{
    const k=st.k,N=1000,L=2**k-1;let wins=0,s=0,s2=0;const outs=[];
    for(let i=0;i<N;i++){
      let win=false;
      for(let j=0;j<k;j++){if(Math.random()<18/37){win=true;break;}}
      const x=win?1:-L;s+=x;s2+=x*x;if(win)wins++;outs.push(win);
    }
    const mean=s/N,sd=Math.sqrt(Math.max(0,s2/N-mean*mean));
    st.many={k,N,mean,sd,wins:wins/N};
    $('#s3wf',el).innerHTML=outs.slice(-100).map((w,i,a)=>`<i class="wf ${w?'s':'f'}${i===a.length-1?' last':''}"></i>`).join('');
    upd3(el);
  };
  $('#s3wf',el).innerHTML=Array.from({length:100},()=>'<i class="wf"></i>').join('');
  $('#s3clr',el).onclick=()=>{
    st.many=null;st.busy=false;
    $('#s3chips',el).innerHTML='';
    $('#s3wf',el).innerHTML=Array.from({length:100},()=>'<i class="wf"></i>').join('');
    $$('.lad',el).forEach(b2=>b2.classList.remove('l','w'));
    const g=el.querySelector('#s3wheel .rot');
    if(g){g.style.transition='transform .45s ease';g.style.transform='rotate(0deg)';wRot=0;}
    const wr=el.querySelector('#wres');if(wr)wr.textContent='Колесо готово';
    const o=$('#s3one',el);if(o)o.disabled=false;
    drawLadder(el);upd3(el);
    if(typeof buildTbl==='function')buildTbl(el);
  };
  upd3(el);
}

async function singleSession(el,wheel){
  const st=S.s3;
  if(st.busy)return;
  st.busy=true;
  const btn=$('#s3one',el);if(btn)btn.disabled=true;
  const box=$('#s3chips',el);if(box)box.innerHTML='';
  $$('.lad',el).forEach(b=>b.classList.remove('l','w'));
  let bet=1,won=false;
  for(let i=0;i<st.k;i++){
    if(!el.isConnected)break;
    const x=randOut('rul');
    wheel.spinTo(x,0.9);
    await sleep(950);
    const bx=$('#s3chips',el);if(!bx)break;
    const bar=$(`.lad[data-i="${i}"]`,el);
    if(RED.has(x)){
      won=true;
      if(bar)bar.classList.add('w');
      bx.insertAdjacentHTML('beforeend',`<span class="rc2 w">Ставка ${bet} → ${x}: красное ✓ <b>+1 $</b></span>`);
      break;
    }
    if(bar)bar.classList.add('l');
    bx.insertAdjacentHTML('beforeend',`<span class="rc2 l">Ставка ${bet} → ${x}: ✗ <b>−${bet} $</b></span>`);
    bet*=2;
  }
  if(el.isConnected){
    const bx=$('#s3chips',el);
    const L=2**st.k-1;
    if(bx)bx.insertAdjacentHTML('beforeend',`<div class="kpi" style="width:100%">Итог сессии: <b>${won?'+1 $':'−'+L+' $'}</b></div>`);
    if(won)confetti(18);
    const b2=$('#s3one',el);if(b2)b2.disabled=false;
  }
  st.busy=false;
}

const SIG1=Math.sqrt(1-1/1369); // σ одной ставки 1 $ на красное
function simCasino(el){
  const st=S.m;
  el.innerHTML=`<div class="card sim5">
    <div class="btns" style="margin-top:0">
      <span class="hint" style="align-self:center">Сколько ставок сыграли в казино:</span>
      ${[100,1000,10000,100000,1000000].map(n=>`<button class="btn sm ${st.cn===n?'on':''}" data-cn="${n}">${n.toLocaleString('ru-RU').replace(/\u00a0/g,' ')}</button>`).join('')}
    </div>
    <div id="cnOut"></div>
    <div class="btns">
      <button class="btn red sm" id="cnSim">Запустить 50 игроков</button><button class="btn ghost sm" id="cnR">Сброс</button>
      <span class="hint" id="cnHint" style="align-self:center"></span>
    </div>
    <div class="cnbars" id="cnPl"><span class="cnlab">выше нуля — игрок в плюсе, ниже — в минусе</span></div>
  </div>`;
  $$('[data-cn]',el).forEach(b=>b.onclick=()=>{st.cn=+b.dataset.cn;simCasino(el);});
  const n=st.cn;
  const En=-n/37,sn=Math.sqrt(n)*SIG1,z=En/sn,P=Phi(z);
  $('#cnOut',el).innerHTML=`
    <div class="kpi">Ожидаемый доход казино: M(S<sub>n</sub>) = −n/37 ⇒ <b>${fmtN(-En)} $</b></div>
    <div class="kpi">Разброс дохода: σ(S<sub>n</sub>) = √n·σ₁ ≈ <b>${fmtN(sn)} $</b></div>
    <div class="kpi">Шанс, что вы в плюсе после ${fmtN(n)} ставок: ≈ <b>${pc(P,P<0.001?3:1)}</b></div>`;
  const btn=$('#cnSim',el),hint=$('#cnHint',el);
  if(n>10000){btn.disabled=true;hint.textContent='Слишком много ставок для браузера — смотрите формулу.';}
  $('#cnR',el).onclick=()=>{st.cn=100;simCasino(el);};
  btn.onclick=()=>{
    const res=[];
    for(let p=0;p<50;p++){let sum=0;for(let i=0;i<n;i++)sum+=(Math.random()<18/37?1:-1);res.push(sum);}
    const mx=Math.max(1,...res.map(Math.abs));
    const win=res.filter(v=>v>0).length;
    const total=res.reduce((a,b)=>a+b,0);
    const box=$('#cnPl',el);
    box.innerHTML=`<span class="cnlab">выше нуля — игрок в плюсе, ниже — в минусе</span>`+res.map(v=>`<div class="cbc" title="${v} $"><i class="cb ${v>0?'up':'dn'}" data-h="${(Math.abs(v)/mx*70).toFixed(1)}"></i></div>`).join('');
    requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.cb',box).forEach(b=>b.style.height=b.dataset.h+'px')));
    hint.innerHTML=`В плюсе: <b>${win}</b> из 50 (по теории ≈ ${Math.round(P*50)}). Все 50 вместе проиграли <b>${fmtN(-total)} $</b>. Казино заработало именно это.`;
  };
}
